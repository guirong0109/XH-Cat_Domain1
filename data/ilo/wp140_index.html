        <section id="ID0E4C">
          <a id="ID0E6C"> </a>
          <h1>Abstract</h1>
          <p>This study updates the ILO’s 2023 Global Index of Occupational Exposure to Generative AI (GenAI), incorporating recent advances in the technology and increasing user familiarity with GenAI tools. Using a representative sample from the 29,753 tasks in the Polish occupational classification system and a survey of 1,640 people employed in each 1-digit ISCO-08 groups, we collect 52,558 data points regarding perceive potential of automation for 2,861 tasks. We then compare this input with a survey and several rounds of Delphi-style discussions among a smaller group of international experts. Based on this process, we create a repository of knowledge about task automation that goes beyond national specificities and use it to develop an AI assistant able to predict scores for tasks in the technical documentation of ISCO-08. </p>
          <p>Our 2025 scores are presented in a revised framework of four progressively increasing exposure gradients, with a new set of global estimates of employment shares exposed to GenAI. Clerical occupations continue to have the highest exposure levels. Additionally, some strongly digitized occupations have increased exposure, highlighting the expanding abilities of GenAI regarding specialized tasks in professional and technical roles. </p>
          <p>Globally, one in four workers are in an occupation with some GenAI exposure. 3.3% of global employment falls into the highest exposure category, albeit with significant differences between female (4.7%) and male employment (2.4%). These differences increase with countries’ income (9.6% female vs 3.5% male in Gradient 4 in HICs), and so does the overall exposure (11% of total employment in LICs vs 34% in HICs). As most occupations consist of tasks that require human input, transformation of jobs is the most likely impact of GenAI. Linking our refined index with national micro data enables precise projections of such transformations, offering a foundation for social dialogue and targeted policy responses to manage the transition. </p>
        </section>
        <section id="ID0EVIAC">
          <a id="ID0EXIAC"> </a>
          <h1>Introduction</h1>
          <p>In August 2023, the ILO published the first global employment estimates of potential occupational exposure to generative artificial intelligence (GenAI) (Gmyrek et al., 2023). This research was prompted by concerns – that have featured prominently in the media – of the potential for the technology to replace large shares of knowledge work.</p>
          <p>Since the release of the 2023 estimates, there have been further technological advances in GenAI, including the introduction of Large Language Models (LLMs) with expanded capabilities in image recognition and audio and video production. Moreover, many new GenAI applications have been developed as a result of the possibility of linking GenAI models with Application Programming Interface (API) tools. Indeed, GenAI has been likened to a general-purpose technology, meaning that it may continue generating new applications and innovations across various sectors, driving long-term economic and societal transformations.</p>
          <p>Despite this rapidly developing landscape, it is important for policy makers to develop deeper understanding of how technological advances might impact existing jobs. To address this need, the Research department of the ILO has partnered with NASK, the National Research Institute of the Ministry of Digital Affairs in Poland, to develop a more precise assessment of potential effects of GenAI on employment across countries.</p>
          <p>This study builds on the method developed by the ILO <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;avfs3Np9&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Gmyrek et al., 2023)&quot;,&quot;plainCitation&quot;:&quot;(Gmyrek et al., 2023)&quot;,&quot;dontUpdate&quot;:true,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:50384,&quot;uris&quot;:[&quot;http://zotero.org/groups/4848274/items/RLX2P6B7&quot;],&quot;itemData&quot;:{&quot;id&quot;:50384,&quot;type&quot;:&quot;report&quot;,&quot;abstract&quot;:&quot;This study assesses the potential global exposure of occupations to Generative AI, particularly GPT-4. It predicts that the overwhelming effect of the technology will be to augment occupations, rather than to automate them. The greatest impact is likely to be in high and upper-middle income countries due to a higher share of employment in clerical occupations. As clerical jobs are an important source of female employment, the effects are highly gendered. Insights from this study underline the need for proactive policies that focus on job quality, ensure fair transitions, and that are based on dialogue and adequate regulation.&quot;,&quot;genre&quot;:&quot;Working paper&quot;,&quot;language&quot;:&quot;en&quot;,&quot;license&quot;:&quot;Copyright and permissions © 1996-2023 International Labour Organization - /global/copyright/lang--en/index.htm&quot;,&quot;note&quot;:&quot;ISBN: 9789220395356&quot;,&quot;source&quot;:&quot;www.ilo.org&quot;,&quot;title&quot;:&quot;Generative AI and Jobs: A global analysis of potential effects on job quantity and quality&quot;,&quot;title-short&quot;:&quot;Generative AI and Jobs&quot;,&quot;URL&quot;:&quot;http://www.ilo.org/global/publications/working-papers/WCMS_890761/lang--en/index.htm&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Gmyrek&quot;,&quot;given&quot;:&quot;Pawel&quot;},{&quot;family&quot;:&quot;Berg&quot;,&quot;given&quot;:&quot;Janine&quot;},{&quot;family&quot;:&quot;Bescond&quot;,&quot;given&quot;:&quot;David&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2023&quot;,10,30]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2023&quot;,8,21]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">(Gmyrek, Berg and Bescond, 2023 - GBB hereafter)</field>, which used task descriptions from the 4-digit International Standard Classification of Occupations (ISCO-08) and the GPT-4 model to estimate task-level and occupational scores of exposure to GenAI technology and then derives global employment estimates based on official ILO labour force data. But the study includes several key refinements. </p>
          <p>The first step in our analysis is based on Poland’s national 6-digit classification of occupations that includes nearly 30,000 tasks. This expands tenfold the number of tasks given in the ISCO-08 structure and enables a fine-grained assessment of tasks’ automation potential, based on a more up-to-date set of occupations and tasks than those captured in the ISCO-08 system. As Poland’s 6-digit classification is aligned with the 4-digit ISCO-08, the occupational scores can be compiled at the 4-digit level allowing a straightforward comparison and updating of the 2023 estimates of the ILO (GBB). In addition, the study improves the methodological framework of GBB, by drawing on the combined strengths of human and AI abilities, with an additional layer of expert verification. </p>
          <p>Specifically, we surveyed 1,640 people currently employed in Poland in each ISCO-08 1-digit group to rank the automation potential of a representative sample of tasks that pertain to their occupational group. As the second step, we asked a mix of national and international experts to conduct a detailed review of a large sample of tasks previously assessed in the survey to validate or adjust the level of automation scores through an iterative process. Since we maintain the hierarchical link to ISCO-08 and focus on technological feasibility rather than specific country context, by combining opinions of local and international experts, we create a system that enables more precise predictions of the potential of automation of individual occupational tasks with GenAI technology, including at the international level. To achieve that, we input the human scores into an AI model, to generate scores reflecting human judgement for nearly 30,000 individual tasks pertaining to 2,500 occupations at 6-digit level in Poland. We then use the same AI predictor to re-generate scores for the tasks in ISCO-08, previously provided by GBB (2023), thereby adjusting the 2023 index of the ILO, which now benefits from both the input of people employed in each ISCO-08 1-digit group and from expert opinions. As the final step, we provide updated global, regional and income-based estimates of employment that has the potential to be transformed by Gen AI technology.</p>
          <p>Our study specifically targets GenAI tools, isolating the effects of this recent family of AI from broader AI applications, such as the use of Machine Learning (ML) algorithms or image recognition in industrial production. There are several considerations that justify such selective focus. First, we respond to the growing need for a research tool that could provide a better picture of GenAI’s potential impact on national labour markets, given the growing societal angst concerning this technology and the recent reports about increasing levels of adoption of GenAI at work <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;cKizPlQK&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Bick et al., 2024; Faverio and Tyson, 2022; Grampp et al., 2023; Maison &amp; Partners and ThinkTank, 2024; Pew Research Center, 2023; Rutgers, 2024)&quot;,&quot;plainCitation&quot;:&quot;(Bick et al., 2024; Faverio and Tyson, 2022; Grampp et al., 2023; Maison &amp; Partners and ThinkTank, 2024; Pew Research Center, 2023; Rutgers, 2024)&quot;,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:51055,&quot;uris&quot;:[&quot;http://zotero.org/groups/5618753/items/362QSNV6&quot;],&quot;itemData&quot;:{&quot;id&quot;:51055,&quot;type&quot;:&quot;article&quot;,&quot;abstract&quot;:&quot;Generative Artificial Intelligence (AI) is a potentially important new technology, but its impact on the economy depends on the speed and intensity of adoption. This paper reports results from the first nationally representative U.S. survey of generative AI adoption at work and at home. In August 2024, 39 percent of the U.S. population age 18-64 used generative AI. More than 24 percent of workers used it at least once in the week prior to being surveyed, and nearly one in nine used it every workday. Historical data on usage and mass-market product launches suggest that U.S. adoption of generative AI has been faster than adoption of the personal computer and the internet. Generative AI is a general purpose technology, in the sense that it is used in a wide range of occupations and job tasks at work and at home.&quot;,&quot;collection-title&quot;:&quot;Working Paper Series&quot;,&quot;DOI&quot;:&quot;10.3386/w32966&quot;,&quot;genre&quot;:&quot;Working Paper&quot;,&quot;note&quot;:&quot;DOI: 10.3386/w32966&quot;,&quot;number&quot;:&quot;32966&quot;,&quot;publisher&quot;:&quot;National Bureau of Economic Research&quot;,&quot;source&quot;:&quot;National Bureau of Economic Research&quot;,&quot;title&quot;:&quot;The Rapid Adoption of Generative AI&quot;,&quot;URL&quot;:&quot;https://www.nber.org/papers/w32966&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Bick&quot;,&quot;given&quot;:&quot;Alexander&quot;},{&quot;family&quot;:&quot;Blandin&quot;,&quot;given&quot;:&quot;Adam&quot;},{&quot;family&quot;:&quot;Deming&quot;,&quot;given&quot;:&quot;David J.&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,10,17]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,9]]}}},{&quot;id&quot;:50667,&quot;uris&quot;:[&quot;http://zotero.org/groups/5406503/items/22ZF4ZZJ&quot;],&quot;itemData&quot;:{&quot;id&quot;:50667,&quot;type&quot;:&quot;post-weblog&quot;,&quot;abstract&quot;:&quot;Today, 52% of Americans are more concerned than excited about AI in daily life, compared with just 10% who say they are more excited than concerned.&quot;,&quot;container-title&quot;:&quot;Pew Research Center&quot;,&quot;language&quot;:&quot;en-US&quot;,&quot;title&quot;:&quot;What the data says about Americans’ views of artificial intelligence&quot;,&quot;URL&quot;:&quot;https://www.pewresearch.org/short-reads/2023/11/21/what-the-data-says-about-americans-views-of-artificial-intelligence/&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Faverio&quot;,&quot;given&quot;:&quot;Michelle&quot;},{&quot;family&quot;:&quot;Tyson&quot;,&quot;given&quot;:&quot;Alec&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,3,14]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2022&quot;,3]]}}},{&quot;id&quot;:50708,&quot;uris&quot;:[&quot;http://zotero.org/groups/5406503/items/UEIZRMBF&quot;],&quot;itemData&quot;:{&quot;id&quot;:50708,&quot;type&quot;:&quot;report&quot;,&quot;abstract&quot;:&quot;Usage and attitudes of the Swiss workforce towards Generative AI&quot;,&quot;language&quot;:&quot;en&quot;,&quot;title&quot;:&quot;Generative AI’s fast and furious entry into Switzerland (Delloite)&quot;,&quot;URL&quot;:&quot;https://www2.deloitte.com/ch/en/pages/technology/articles/generative-ai.html&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Grampp&quot;,&quot;given&quot;:&quot;Michael&quot;},{&quot;family&quot;:&quot;Brandes&quot;,&quot;given&quot;:&quot;Dennis&quot;},{&quot;family&quot;:&quot;Laude&quot;,&quot;given&quot;:&quot;Daniel&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,3,26]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2023&quot;]]}}},{&quot;id&quot;:&quot;Ta7NpVRM/dtNrP5FZ&quot;,&quot;uris&quot;:[&quot;http://zotero.org/groups/5397877/items/RXB4TI56&quot;],&quot;itemData&quot;:{&quot;id&quot;:51065,&quot;type&quot;:&quot;report&quot;,&quot;event-place&quot;:&quot;Warsaw&quot;,&quot;publisher-place&quot;:&quot;Warsaw&quot;,&quot;title&quot;:&quot;POLACY O AI: codzienność, nadzieje, obawy&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Maison &amp; Partners&quot;,&quot;given&quot;:&quot;&quot;},{&quot;family&quot;:&quot;ThinkTank&quot;,&quot;given&quot;:&quot;&quot;}],&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,10]]}}},{&quot;id&quot;:50665,&quot;uris&quot;:[&quot;http://zotero.org/groups/5406503/items/REUSGPWZ&quot;],&quot;itemData&quot;:{&quot;id&quot;:50665,&quot;type&quot;:&quot;post-weblog&quot;,&quot;container-title&quot;:&quot;Internet, Science &amp; Tech&quot;,&quot;language&quot;:&quot;en-US&quot;,&quot;title&quot;:&quot;Americans explain in their own words what makes them either more concerned or more excited about the increased presence of AI in daily life&quot;,&quot;URL&quot;:&quot;https://www.pewresearch.org/internet/2022/03/17/ai-and-human-enhancement-americans-openness-is-tempered-by-a-range-of-concerns/ps_2022-03-17_ai-he_01-02/&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Pew Research Center&quot;,&quot;given&quot;:&quot;&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,3,14]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2023&quot;,11]]}}},{&quot;id&quot;:50710,&quot;uris&quot;:[&quot;http://zotero.org/groups/5406503/items/N2ACTTEB&quot;],&quot;itemData&quot;:{&quot;id&quot;:50710,&quot;type&quot;:&quot;report&quot;,&quot;collection-title&quot;:&quot;Heldrich Center for Workforce Development&quot;,&quot;title&quot;:&quot;U.S. Workers Assess the Impacts of Artificial Intelligence on Jobs: Topline Survey Results&quot;,&quot;URL&quot;:&quot;https://www.heldrich.rutgers.edu/sites/default/files/2024-02/Work_Trends_February_2024.pdf&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Rutgers&quot;,&quot;given&quot;:&quot;&quot;}],&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,2]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">(Bick et al., 2024; Faverio and Tyson, 2022; Grampp et al., 2023; Maison &amp; Partners and ThinkTank, 2024; Pew Research Center, 2023; Rutgers, 2024)</field>. Second, while several indicators of occupational exposure to broader AI technologies are available to researchers <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;ppMr7blw&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Nurski and Vansteenkiste, 2024)&quot;,&quot;plainCitation&quot;:&quot;(Nurski and Vansteenkiste, 2024)&quot;,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:51067,&quot;uris&quot;:[&quot;http://zotero.org/groups/5397877/items/XCIW9MSE&quot;],&quot;itemData&quot;:{&quot;id&quot;:51067,&quot;type&quot;:&quot;article&quot;,&quot;title&quot;:&quot;De impact van technologie op beroepen. Het belang en de bruikbaarheid van impactscores en taakindices voor monitoring, analyses en projecties van de arbeidsmarkt&quot;,&quot;URL&quot;:&quot;https://www.steunpuntwerk.be/files/publications/OW/OW_2024_1/OverWerk_2024_1_06.pdf&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Nurski&quot;,&quot;given&quot;:&quot;Laura&quot;},{&quot;family&quot;:&quot;Vansteenkiste&quot;,&quot;given&quot;:&quot;Sarah&quot;}],&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">(Nurski and Vansteenkiste, 2024)</field>, very few tools allow for a more detailed focus on GenAI <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;FDAmpiga&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Nurski and Ruer, 2024)&quot;,&quot;plainCitation&quot;:&quot;(Nurski and Ruer, 2024)&quot;,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:50635,&quot;uris&quot;:[&quot;http://zotero.org/groups/5406503/items/37CS8BAA&quot;],&quot;itemData&quot;:{&quot;id&quot;:50635,&quot;type&quot;:&quot;article-journal&quot;,&quot;abstract&quot;:&quot;We apply two sets of generative artificial intelligence (GenAI) exposure scores on the European Labour Force Survey—one task-based, the other ability-based. While using different methodologies, our findings reveal consistent demographic patterns across the two approaches: women, highly educated and younger workers are more exposed to GenAI. We also review the literature on the recent productivity impact of GenAI. Within the same occupation, less experienced or less skilled workers consistently get the largest productivity gains from GenAI support.\nWe argue that a task-based analysis is more fruitful than an ability-based one, both for guiding GenAI adoption and implementation in organizations and their workplaces, as well as for assessing the employment and job quality impact for workers.\nFinally, we provide policy recommendations that go beyond mere adjustments in the labour supply such as training and social safety nets, aiming to also shape future labour demand through job redesign and SME support. Monitoring GenAI’s employment effects and researching the ‘jagged technological frontier’ is necessary to further build our understanding of the employment impact of this transformational technology.&quot;,&quot;title&quot;:&quot;Exposure to generative AI in the European labour market: distributional implications&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Nurski&quot;,&quot;given&quot;:&quot;Laura&quot;},{&quot;family&quot;:&quot;Ruer&quot;,&quot;given&quot;:&quot;Nina&quot;}],&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">(Nurski and Ruer, 2024)</field>. A new, more precise exposure index enables a closer alignment of the academic work on digital economy and labour with the significant interest in the GenAI technology in the media and in the public debate.<span class="footnote-box" onclick="footnotePop(fnID0EEGAC)" xmlns:mml="http://www.w3.org/1998/Math/MathML">1</span> Third, the methodological blueprint provided by our research can be quite flexibly expanded to other types of AI in the future or focused more narrowly on specific subsets of digital technologies and sectors of their application. </p>
          <p>This paper is the first in a series of upcoming publications based on ILO and NASK cooperation that strive to improve the methodology for assessing employment effects of AI, but also to document in detail the methods used, including the survey, expert verification process and the construction of the AI model used for predictions. Subsequent papers will present an assessment of the potential impact of GenAI on the Polish labour market, based on more detailed occupation and task-level data and using a mix of quantitative and qualitative methods. All publications will include the methodological blueprints and technical details of both the quantitative and qualitative components, including survey questionnaires and interview guidelines. By making these tools openly accessible, we hope to contribute to the development of an improved method for assessing potential impact of GenAI on jobs and to stimulate more detailed national-level studies, including in lower- and middle-income countries.</p>
        </section>
        <section id="ID0E4KAC">
          <a id="ID0E6KAC"> </a>
          <h1>Task-based approaches to automation in the literature</h1>
          <p>Central to the study of technology on work is the insight that jobs are a “bundle of tasks” (Autor, 2015). As such, task automation might, or might not lead to job automation, depending on the importance of a particular task to an occupation. Analyses of employment effects of automation that use the task-based approach, including this study, attempt to capture two central considerations: (i) the ability of a specific technology to automate a given task and (ii) the character of existing occupations in the labour market, based on the detailed tasks performed by these occupations. By modelling the intersection of these two dimensions, one arrives at a range of possible projections of how such technology could interact with occupational tasks, leading either to their full automation through technology-driven substitution, or to a transformation, through partial automation and human-machine complementarity. While the task-based framework certainly has limitations, recent academic literature shows the analytical advantages of this method for modelling employment and labour market impacts <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;9XdiUR8X&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Acemoglu et al., 2024; Nurski and Ruer, 2024)&quot;,&quot;plainCitation&quot;:&quot;(Acemoglu et al., 2024; Nurski and Ruer, 2024)&quot;,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:51046,&quot;uris&quot;:[&quot;http://zotero.org/groups/5618753/items/F8LNTGV7&quot;],&quot;itemData&quot;:{&quot;id&quot;:51046,&quot;type&quot;:&quot;article&quot;,&quot;abstract&quot;:&quot;This chapter reviews recent advances in the task model and shows how this framework can be put to work to understand the major labor market trends of the last several decades. Production in each industry necessitates the completion of a range of tasks, which can be allocated to workers of different skill types or to capital. Factors of production have well-defined comparative advantage across tasks, which governs the pattern of substitution between skill groups. Technological change can: (1) augment a specific labor type—e.g., increase the productivity of labor in tasks it is already performing; (2) augment capital; (3) automate work by enabling capital to perform tasks previously allocated to labor; (4) create new tasks. The task model clarifies that these different types of technological changes have distinct effects on labor demand, factor shares and productivity, and their full impact depends on the pattern of substitution between different factors which arises endogenously in the task framework. We explore the implications of the task framework using reduced-form evidence, which highlights the central role of automation and new tasks in recent labor market trends. We also explain how general equilibrium effects ignored in these reduced-form approaches can be estimated structurally.&quot;,&quot;collection-title&quot;:&quot;Working Paper Series&quot;,&quot;DOI&quot;:&quot;10.3386/w32872&quot;,&quot;genre&quot;:&quot;Working Paper&quot;,&quot;note&quot;:&quot;DOI: 10.3386/w32872&quot;,&quot;number&quot;:&quot;32872&quot;,&quot;publisher&quot;:&quot;National Bureau of Economic Research&quot;,&quot;source&quot;:&quot;National Bureau of Economic Research&quot;,&quot;title&quot;:&quot;Tasks At Work: Comparative Advantage, Technology and Labor Demand&quot;,&quot;title-short&quot;:&quot;Tasks At Work&quot;,&quot;URL&quot;:&quot;https://www.nber.org/papers/w32872&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Acemoglu&quot;,&quot;given&quot;:&quot;Daron&quot;},{&quot;family&quot;:&quot;Kong&quot;,&quot;given&quot;:&quot;Fredric&quot;},{&quot;family&quot;:&quot;Restrepo&quot;,&quot;given&quot;:&quot;Pascual&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,10,16]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,8]]}}},{&quot;id&quot;:50635,&quot;uris&quot;:[&quot;http://zotero.org/groups/5406503/items/37CS8BAA&quot;],&quot;itemData&quot;:{&quot;id&quot;:50635,&quot;type&quot;:&quot;article-journal&quot;,&quot;abstract&quot;:&quot;We apply two sets of generative artificial intelligence (GenAI) exposure scores on the European Labour Force Survey—one task-based, the other ability-based. While using different methodologies, our findings reveal consistent demographic patterns across the two approaches: women, highly educated and younger workers are more exposed to GenAI. We also review the literature on the recent productivity impact of GenAI. Within the same occupation, less experienced or less skilled workers consistently get the largest productivity gains from GenAI support.\nWe argue that a task-based analysis is more fruitful than an ability-based one, both for guiding GenAI adoption and implementation in organizations and their workplaces, as well as for assessing the employment and job quality impact for workers.\nFinally, we provide policy recommendations that go beyond mere adjustments in the labour supply such as training and social safety nets, aiming to also shape future labour demand through job redesign and SME support. Monitoring GenAI’s employment effects and researching the ‘jagged technological frontier’ is necessary to further build our understanding of the employment impact of this transformational technology.&quot;,&quot;title&quot;:&quot;Exposure to generative AI in the European labour market: distributional implications&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Nurski&quot;,&quot;given&quot;:&quot;Laura&quot;},{&quot;family&quot;:&quot;Ruer&quot;,&quot;given&quot;:&quot;Nina&quot;}],&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">(Acemoglu et al., 2024; Nurski and Ruer, 2024)</field>.</p>
          <p>Research on AI and tasks has shown important improvements in methods and scope in recent years, which includes using AI tools for research purposes. In one of the early papers on Machine Learning (ML) and jobs, <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;2YMboPuw&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Frey and Osborne, 2017)&quot;,&quot;plainCitation&quot;:&quot;(Frey and Osborne, 2017)&quot;,&quot;dontUpdate&quot;:true,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:49585,&quot;uris&quot;:[&quot;http://zotero.org/groups/4848274/items/5IKCUI2M&quot;],&quot;itemData&quot;:{&quot;id&quot;:49585,&quot;type&quot;:&quot;article-journal&quot;,&quot;abstract&quot;:&quot;We examine how susceptible jobs are to computerisation. To assess this, we begin by implementing a novel methodology to estimate the probability of computerisation for 702 detailed occupations, using a Gaussian process classifier. Based on these estimates, we examine expected impacts of future computerisation on US labour market outcomes, with the primary objective of analysing the number of jobs at risk and the relationship between an occupations probability of computerisation, wages and educational attainment.&quot;,&quot;container-title&quot;:&quot;Technological Forecasting and Social Change&quot;,&quot;DOI&quot;:&quot;10.1016/j.techfore.2016.08.019&quot;,&quot;ISSN&quot;:&quot;0040-1625&quot;,&quot;journalAbbreviation&quot;:&quot;Technological Forecasting and Social Change&quot;,&quot;language&quot;:&quot;en&quot;,&quot;page&quot;:&quot;254-280&quot;,&quot;source&quot;:&quot;ScienceDirect&quot;,&quot;title&quot;:&quot;The future of employment: How susceptible are jobs to computerisation?&quot;,&quot;title-short&quot;:&quot;The future of employment&quot;,&quot;volume&quot;:&quot;114&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Frey&quot;,&quot;given&quot;:&quot;Carl Benedikt&quot;},{&quot;family&quot;:&quot;Osborne&quot;,&quot;given&quot;:&quot;Michael A.&quot;}],&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2017&quot;,1,1]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">Frey and Osborne, (2013)</field> fed the opinions of a group of IT technology experts into an ML algorithm to develop occupational-level projections of automation potential for the US job market. The emergence of GenAI APIs has simplified the possibility of combining human expertise and algorithmic capacities for research purposes. Relying on this idea, Eloundou et al. (2023) demonstrated a close alignment of GPT-4 predictions with a survey of 70 AI experts on the potential of automating occupational tasks with LLMs, and subsequently built on this feature to develop synthetic automation scores for the US market.</p>
          <p>Most task-based studies are focussed on the US, due to the very detailed nature of the O*NET database, as well as its public accessibility. This typically forces researchers interested in the global picture or other countries and regions to base their analysis on the strong assumption of similarity of local economic and labour effects to those projected in the US context. In reality, occupational tasks can vary significantly among individual countries, which poses a particular challenge in developing countries. As such, working with tasks in the ISCO-08 system offers a useful and simple common denominator for projections across different countries, regions and income groups. Our method combines the strengths of this global framework with a significantly more detailed national classification system in Poland, which provides a detailed list of occupations and tasks, based on the latest labour market data. This helps us establish a starting point for modelling interaction of GenAI’s abilities with up-to-date tasks and occupations in a setting located between the countries with highest incomes and the emerging economies (Figure 1). Using a combination of GenAI tools, we subsequently transfer this knowledge back to the tasks in ISCO-08 system.</p>
        </section>
        <section id="ID0EDMAC">
          <a id="ID0EFMAC"> </a>
          <h1>Tasks and occupations in the 6-digit system in Poland</h1>
          <p>Within Europe, Poland is quite representative of the larger group of Central and Eastern European (CEE) countries, albeit with a significantly larger population (38 million) than most of its peers. Globally, the CEE ranks between the high-income advanced economies and the emerging economies of the Global South. With respect to access to the internet, Poland ranks below UK and Germany, but higher than Japan and France. Thus, for assessing the potential of task automation, it seems reasonable to assume that Poland is representative of the upper threshold of automation potential, due to high availability of digital equipment and widespread internet access.</p>
          <p class="Caption-Image">Figure 1. Income- and population-based similarities (A) and access to the internet (B) across countries</p>
          <p>
            <img width="100%" class="standard-img" src="chapter-02_-image1.png" />
          </p>
          <p>The Ministry of Family, Labour and Social Policy (MOL) in Poland maintains a system of occupational classifications, with task and job descriptions that are regularly updated.<span class="footnote-box" onclick="footnotePop(fnID0EUHAC)" xmlns:mml="http://www.w3.org/1998/Math/MathML">2</span> The system is used by Statistics Poland (GUS) and other state institutions for labor market analysis. At the most detailed, 6-digit level, this framework contains 2541 occupations and 29,753 corresponding tasks (Table 1). Since the system is publicly available online, we initially designed a scraping bot that crawled through individual occupational pages and downloaded job descriptions and corresponding tasks into a structured data frame.<span class="footnote-box" onclick="footnotePop(fnID0E5HAC)" xmlns:mml="http://www.w3.org/1998/Math/MathML">3</span> The extracted content was subsequently cross verified against a tabular occupational classification provided by the Ministry. The Polish classification system is compatible with the hierarchical structure of ISCO-08, which means that we could easily append an additional mapping of occupations from 1 to 4-digit level (Table 1). </p>

        <section id="ID0ERTAE">
          <a id="ID0ETTAE"> </a>
          <h1>Assessment of tasks’ automation potential</h1>
          <section id="ID0EXTAE">
            <a id="ID0EYTAE"> </a>
            <h2>3.1. Initial Algorithmic predictions</h2>
            <p>As the first step, we conducted a purely algorithmic assessment of potential exposure to automation for each task in the Polish 6-digit system, relying on three advanced LLMs available on the market at the end of 2024: GPT-4, GPT-4o and Gemini Flash 1.5. The method relies on the approach previously used by GBB (2023), with a sequential API call devised to assign a score ranging from 0 to 1 for each individual task, where 0 means the task cannot be automated and 1 means the task could be fully automated with GenAI technology (the task can be conducted without participation of a human operator).<span class="footnote-box" onclick="footnotePop(fnID0EFMAE)" xmlns:mml="http://www.w3.org/1998/Math/MathML">4</span> The LLM is provided with information on the occupation to which the task pertains in ISCO-08 and requested to produce a justification for each predicted score.</p>
            <p class="Caption-Image">Figure 2. Distribution of synthetic automation scores from 3 LLMs, by ISCO-08 1-digit</p>
            <p>
              <img width="100%" class="standard-img" src="chapter-03_-image1.png" />
            </p>
            <p>The overall distribution of these synthetic automation scores is generally consistent with scores based on ISCO-08 documentation (GBB, 2023; <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;Ye9xjxDZ&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Pawel Gmyrek et al., 2024)&quot;,&quot;plainCitation&quot;:&quot;(Pawel Gmyrek et al., 2024)&quot;,&quot;dontUpdate&quot;:true,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:51024,&quot;uris&quot;:[&quot;http://zotero.org/groups/5618753/items/VF3XNNSL&quot;],&quot;itemData&quot;:{&quot;id&quot;:51024,&quot;type&quot;:&quot;book&quot;,&quot;abstract&quot;:&quot;In this new paper from the International Labour Organization and the World Bank Group, researchers found that Generative AI could have transformative effects on jobs and livelihoods in Latin America and the Caribbean. Nonetheless, gaps in digital infrastructure and other inequalities could hinder the potential impacts of Generative AI in the region.&quot;,&quot;ISBN&quot;:&quot;978-92-2-041003-5&quot;,&quot;language&quot;:&quot;eng&quot;,&quot;note&quot;:&quot;ISSN: 2708-3446\nDOI: 10.54394/TFZY7681&quot;,&quot;publisher&quot;:&quot;ILO : World Bank&quot;,&quot;source&quot;:&quot;researchrepository.ilo.org&quot;,&quot;title&quot;:&quot;Buffer or bottleneck?: employment exposure to generative AI and the digital divide in Latin America&quot;,&quot;title-short&quot;:&quot;Buffer or bottleneck?&quot;,&quot;URL&quot;:&quot;https://researchrepository.ilo.org/esploro/outputs/encyclopediaEntry/Buffer-or-bottleneck/995379093202676&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Gmyrek&quot;,&quot;given&quot;:&quot;Pawel&quot;},{&quot;family&quot;:&quot;Winkler&quot;,&quot;given&quot;:&quot;Hernan&quot;},{&quot;family&quot;:&quot;Garganta&quot;,&quot;given&quot;:&quot;Santiago&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,9,29]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">Gmyrek, Winkler and Garganta, 2024)</field> and O*NET (Elondou, 2023; Felten, 2023): the highest exposure to GenAI is typically observed among groups with the largest share of tasks of cognitive nature and it declines with tasks of physical nature, which are more prominent among occupational groups 4-9 (Figure 2). The largest density of high automation scores is observed among clerical workers and is stable across the three LLMs. In other groups, we observe some important differences in the LLMs’ predictions. In particular, Gemini Flash 1.5 seems to provide a bimodal scoring, with most scores falling either below 0.25 or above 0.6. The other two models provide a wider range of scores, but still with important divergences, which makes it difficult to judge which model one should follow.<span class="footnote-box" onclick="footnotePop(fnID0EVMAE)" xmlns:mml="http://www.w3.org/1998/Math/MathML">5</span> Therefore, we do not examine these distributions in greater detail but proceed directly to improvements that could enhance coherence and stability of our predictions, regardless of the LLM applied.</p>
          </section>
          <section id="ID0EUVAE">
            <a id="ID0EVVAE"> </a>
            <h2>3.2. Selection of occupational tasks for human assessment</h2>
            <p>To improve the precision of our synthetic predictions, we design a human-based evaluation of the potential for task automation. Since scoring of all 29,753 tasks would be too cumbersome for a survey, we focus on a sub-sample of tasks that are representative of the tasks in each professional group at 1-digit ISCO-08 level (Table 1). We employ the standard formula to calculate sample size (see Appendix 2).</p>
            <p>Table 2 presents task sample calculations for each 1-digit category. The minimum number of scorings per question is set to 20, based on the general rule used by ILO Statistics for micro-data analysis, where observations with less than 16 respondents are flagged as unreliable. The number of scorings is set to 35 per respondent, based on our pre-testing of the survey form for potential fatigue effects. </p>

          <p>Within these initial parameters, each respondent is assigned a random set of tasks from the larger sample of tasks for each broad occupational group. The randomization of the tasks’ sample selection maintains a general pattern of the distribution of scores similar to the scores initially generated with the LLMs (Section 4.1). However, the respondents are not made aware of these prior distributions, instead they receive a wide range of tasks with respect to their automation potential.</p>

            <a id="ID0ESEAG"> </a>
            <h2>3.3. Survey design and recruitment</h2>
            <p>We conducted the human survey using the Computer-Assisted Web Interview (CAWI) method, drawing on a large online research platform in Poland, used for both commercial and scientific studies. This also means that some demographic characteristics are already pre-filtered at survey deployment stage, whereas others are captured through a set of core questions at the start of the survey (Table 3). Specifically, we capture respondents’ gender, age group, size and place of residence, region of residence, highest level of education and their current profession. The professional classification is further facilitated by providing respondents with a short description of ISCO-08 1-digit classifications, alongside examples of occupations that fit into each category.</p>
            <p>In addition to demographic information, subsequent core questions are designed to capture respondents' knowledge and experience with GenAI. These questions help contextualize how familiarity and interaction with GenAI may influence assessments of task automation potential. Specifically, respondents are asked how long they have worked in their current profession (Q4), as more experienced workers may have a deeper understanding of their tasks and offer more cautious or realistic assessments. Additionally, they are queried on their familiarity with AI (Q5), with more knowledgeable respondents potentially providing more informed evaluations. We also capture how often respondents use AI tools in their job (Q6), which provides insight into their practical engagement with AI and its integration into their daily tasks. </p>
            <p>Finally, in core questions 7-8, we ask how respondents view the broader impact of AI on jobs in their field, helping us understand their perspectives on automation over the next five years. The final question in this section probes respondents’ views on the likelihood that their own job could be partially or fully replaced by AI, which helps assess whether job security concerns might influence their task evaluations. Table 3 below provides a summary of the core questions. </p>

            <p>In its main section, the survey moves to the assessment of respondents’ perception of tasks’ automation potential. Each respondent is presented with a random selection of 35 tasks from their occupational group at 1-digit ISCO-08 level, as previously described in the sample selection process (Section 4.2). For each task, respondents are asked to evaluate the susceptibility of the task to automation by generative AI on a scale from 0 to 100, with 0 indicating "not automatable" and 100 indicating "fully automatable".<span class="footnote-box" onclick="footnotePop(fnID0EQEAG)" xmlns:mml="http://www.w3.org/1998/Math/MathML">6</span> In addition to scoring tasks for automation potential, respondents are asked to indicate whether they personally perform a similar task in their current job by ticking a box next to each task. This allows for the comparison of GenAI’s perceived impact on tasks that are only present in respondents’ occupational group, with those directly relevant to the respondents' current work.</p>

                <li>
                  <p>No</p>
                </li>
              </ul>
            </div>
          </section>
          <section id="ID0EFKAG">
            <a id="ID0EGKAG"> </a>
            <h2>3.4. Survey design limitations</h2>
            <p>The survey is designed to capture insights from individuals currently employed in various occupational categories of the 1-digit ISCO-08 framework. This means that tasks of managers are assessed by individuals working as managers, tasks of professionals are assessed by professionals, etc. The subsequent data analysis explores the differences among individuals based on their attitudes about technology, knowledge of AI and other parameters that are captured in the core questions (Table A3). </p>
            <p>The advantage of this approach is that the tasks are assessed by those familiar with the work from their own professional context. On the downside, this survey design means that the sample may not represent the entire working population, and interpretability of opinions on the automation potential is limited to comparisons within each 1-digit group. We also expect an imbalance of understanding and experience with tasks and GenAI across different occupational groups, as managers or professionals are likely to know more about AI than elementary workers, whereas the latter are likely to understand better the nature of elementary workers’ tasks, but might have less familiarity with GenAI tools. </p>
            <p>We mitigate these negative effects in several ways. First, to equilibrate the level of understanding among participants, a prompt about current abilities of GenAI is shown in the introduction of the second part of the survey (see Text Box 2 and full survey questionnaire in the Appendix). Second, we run a survey among the ILO, NASK and MOL experts on a smaller sample of tasks, drawn from across all ISCO-08 groups, and compare these results to the results of main survey respondents (Section 5). In cases of drastic discrepancies, we consult with the expert group and manually establish what seems to be the most reasonable score.</p>
            <p class="Caption-Box">Text Box 2. Introductory prompt for survey respondents</p>

              <p>We have a short piece of information for you about Generative Artificial Intelligence (GenAI). <b>In our study, we want to distinguish GenAI from artificial intelligence (AI).</b></p>
              <p>
                <b>AI</b> allows you to <b>make decisions based on data</b> (e.g. what product to offer you next in an online store, recognize car license plates at the entrance to the parking lot and raise the barrier)</p>
              <p>
                <b>GenAI can generate new content</b>, e.g. images, text, speech. The most popular tool is ChatGPT, which can answer questions, write emails, prepare an application to the office, create reports, summarize a specified text (e.g. an article, book).</p>
              <p>
                <b>What can GenAI do?</b>
              </p>
              <ul>
                <li>
                  <p>
                    <b>Write a text</b>, "pretending" to be a specific person, e.g. an official, poet, financial analyst;</p>
                </li>
                <li>
                  <p>
                    <b>Prepare translations </b>between languages, e.g. from Polish to English;</p>
                </li>
                <li>
                  <p>
                    <b>Convert written text</b> into human speech ("read" text in a given language);</p>
                </li>
                <li>

                    <b>Program</b> - change specified tasks into computer language code, e.g. Python, HTML;</p>
                </li>
                <li>
                  <p>
                    <b>Generate</b>
                    <b> an image</b>, e.g. a photo, based on a given description, or recognize and describe an image (e.g. what is in the photo).</p>
                </li>
              </ul>
            </div>

          <section id="ID0ESMAG">
            <a id="ID0ETMAG"> </a>
            <h2>3.5. Survey of Task Automation Potential</h2>
            <h3>3.5.1. Sample properties</h3>
            <p>The main survey sample consists of 57,400 observations and 1,640 unique respondents. Among these, 105 participants responded with 'Don't know' to most questions, providing less than 50% of the required task rankings. Due to limited engagement, these participants were removed from the analysis as they were deemed insufficiently credible. The excluded group includes a variety of demographic and occupational profiles, which were carefully reviewed to ensure that their removal would not introduce significant bias into the results. As the next step, we excluded 1,167 observations where participants responded with 'Don't know' to the ranking of task automation potential. This ensures the analysis focuses only on responses where participants felt equipped to provide meaningful input. </p>
            <p>A detailed examination of “don’t know” answers showed that they occur twice as frequently in manual or technical fields – particularly among Technicians and Associate Professionals (Group 3), Craft and Related Trades Workers (Group 7), Plant and Machine Operators and Assemblers (Group 8), and Elementary Occupations (Group 9) – than in other occupational groups.<span class="footnote-box" onclick="footnotePop(fnID0EGHAG)" xmlns:mml="http://www.w3.org/1998/Math/MathML">7</span> Since the differences in stated exposure and frequency of use of GenAI do not seem to justify this pattern (see section 4.5.2), it suggests that participants may have felt less equipped to assess the automation potential of tasks requiring specialized technical expertise or manual skills. This is illustrated though the three tasks with the largest number of “don’t know” responses (7 each): (i) <i>operating devices (centrifuges and filters) used for separating fermented milk mass into yeast slurry</i>, (ii) <i>recording delivered goods and collected coins (tokens)</i>, and (iii) <i>organizing and cleaning the workstation</i>.</p>
            <p>Following this exclusion, we retained a substantial sample of 1,535 respondents, contributing a total of 52,558 data points. These data points correspond exclusively to cases where participants provided valid responses to the primary survey question regarding the potential for task automation. Importantly, this filtering process did not reduce the total number of tasks assessed, which remains at the representative sample size of 2,861, as calculated in Table 2.</p>
            <p class="Caption-Image">Figure 3. Age and sex distribution in the survey compared to Labour Force Survey (LFS) data in Poland (employed individuals)</p>
            <p>
              <img width="100%" class="standard-img" src="chapter-03_-image2.png" />
            </p>
            <p>The survey sample is well-balanced in terms of gender, with 51% female and 49% male respondents. The actual gender distribution among the employed population aged 18+ in Poland is more skewed toward men, with 53.9% of employed individuals being male and 46% female. As shown in Figure 3, this results in the survey overrepresenting female opinions in the younger age brackets (18–29 and 30–39). </p>
            <p class="Caption-Image">Figure 4. Distribution of occupational groups in the survey, compared to LFS in Poland (employed individuals) and to the desired sample (Table 2)</p>
            <p>
              <img width="100%" class="standard-img" src="chapter-03_-image3.png" />
            </p>
            <p>Figure 4 illustrates the broader distribution of the survey sample across ISCO-08 1-digit groups, compared to both the employed population in the LFS and the desired sample (Table 2). Professionals (2) are clearly the most underrepresented group, while groups 1, 8 and 9 are overrepresented in survey responses, compared to the actual employment numbers. Notably, however, the desired sample calculated in Table 2, based on the share of tasks in each 1-digit category, achieves a closer alignment to the LFS structure for certain occupational groups.</p>
            <p class="Caption-Image">Figure 5. Occupation and sex distribution among survey participants compared to LFS in Poland (employed individuals)</p>
            <p>
              <img width="100%" class="standard-img" src="chapter-03_-image4.png" />
            </p>
            <p>In terms of sex-related representation within occupations, largest imbalances occur within occupational groups of public authorities, senior officials and managers (1), clerical workers and elementary occupations (9), which are represented by women in the survey to a visibly higher extent than in the labour market (Figure 5). Men are underrepresented, compared to the LFS, among professionals (1) and craft workers (7). For other occupational groups, the survey pattern is fairly consistent with national labour market trends.</p>
            <p>Such discrepancies are important to note but do not affect our strategy, as the primary goal of sampling was to ensure representativeness of tasks at the level of occupational 1-digit groups, rather than replicating the exact gender and economic structure of the employed population (Table 2). With this objective met, we did not apply additional weight-based adjustments to the survey sample. Instead, the deviations between the survey and LFS are treated as a natural variation inherent to a task-specific character of this study, which follows the imbalances in the total number of tasks across 1-digit groups, as well as other assumptions made in Section 4.2.</p>
            <h3>3.5.2. Participants’ Exposure to GenAI: Screening Questions</h3>
            <p>The screening section of the survey tested participants’ prior exposure to GenAI. A significant majority of survey participants (71.2%) report having heard about this technology, with relatively small differences between genders and occupational groups. Despite this high level of awareness, the actual use of GenAI is limited, with most respondents reporting they "never" (50.1%) or "rarely" (26%) use it. Sporadic use (few times a month) is reported by 17.4% of all participants, with only 4.8% reporting regular use and less than 2% using it very often. Among the 1-digit occupational groups, professionals, technicians, public authorities, senior officials and managers use these technologies more frequently than the groups with a stronger presence of manual tasks (Figure 6). This seems consistent with recent studies of GenAI adoption, which suggest higher use of GenAI among occupations with a larger share of cognitive work <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;yhdLpYDn&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Bick et al., 2024; Parker et al., 2025)&quot;,&quot;plainCitation&quot;:&quot;(Bick et al., 2024; Parker et al., 2025)&quot;,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:51055,&quot;uris&quot;:[&quot;http://zotero.org/groups/5618753/items/362QSNV6&quot;],&quot;itemData&quot;:{&quot;id&quot;:51055,&quot;type&quot;:&quot;article&quot;,&quot;abstract&quot;:&quot;Generative Artificial Intelligence (AI) is a potentially important new technology, but its impact on the economy depends on the speed and intensity of adoption. This paper reports results from the first nationally representative U.S. survey of generative AI adoption at work and at home. In August 2024, 39 percent of the U.S. population age 18-64 used generative AI. More than 24 percent of workers used it at least once in the week prior to being surveyed, and nearly one in nine used it every workday. Historical data on usage and mass-market product launches suggest that U.S. adoption of generative AI has been faster than adoption of the personal computer and the internet. Generative AI is a general purpose technology, in the sense that it is used in a wide range of occupations and job tasks at work and at home.&quot;,&quot;collection-title&quot;:&quot;Working Paper Series&quot;,&quot;DOI&quot;:&quot;10.3386/w32966&quot;,&quot;genre&quot;:&quot;Working Paper&quot;,&quot;note&quot;:&quot;DOI: 10.3386/w32966&quot;,&quot;number&quot;:&quot;32966&quot;,&quot;publisher&quot;:&quot;National Bureau of Economic Research&quot;,&quot;source&quot;:&quot;National Bureau of Economic Research&quot;,&quot;title&quot;:&quot;The Rapid Adoption of Generative AI&quot;,&quot;URL&quot;:&quot;https://www.nber.org/papers/w32966&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Bick&quot;,&quot;given&quot;:&quot;Alexander&quot;},{&quot;family&quot;:&quot;Blandin&quot;,&quot;given&quot;:&quot;Adam&quot;},{&quot;family&quot;:&quot;Deming&quot;,&quot;given&quot;:&quot;David J.&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,10,17]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,9]]}}},{&quot;id&quot;:51083,&quot;uris&quot;:[&quot;http://zotero.org/groups/5618753/items/RVMTLP7F&quot;],&quot;itemData&quot;:{&quot;id&quot;:51083,&quot;type&quot;:&quot;post-weblog&quot;,&quot;abstract&quot;:&quot;A majority of workers rarely or never use AI chatbots like ChatGPT, Gemini or Copilot at work.&quot;,&quot;container-title&quot;:&quot;Pew Research Center&quot;,&quot;language&quot;:&quot;en-US&quot;,&quot;title&quot;:&quot;U.S. Workers Are More Worried Than Hopeful About Future AI Use in the Workplace&quot;,&quot;URL&quot;:&quot;https://www.pewresearch.org/social-trends/2025/02/25/workers-experience-with-ai-chatbots-in-their-jobs/&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Parker&quot;,&quot;given&quot;:&quot;Kim&quot;},{&quot;family&quot;:&quot;Horowitz&quot;,&quot;given&quot;:&quot;Juliana&quot;},{&quot;family&quot;:&quot;O’Hanlon&quot;,&quot;given&quot;:&quot;Julia&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2025&quot;,3,7]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2025&quot;,2,25]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">(Bick et al., 2024; Parker et al., 2025)</field>.</p>
            <p class="Caption-Image">Figure 6. Frequency of use of GenAI, by 1-digit ISCO-08</p>
            <p>
              <img width="100%" class="standard-img" src="chapter-03_-image5.png" />
            </p>
            <p>When considering the potential impact of GenAI on jobs within their industries, most respondents expect either no impact (26.5%) or only a slight impact (30.2%). As shown in Figure 7, manual and technical groups have a significantly higher share of such responses. Reports of moderate and significant impact are highest among professionals (33.8% and 20.4%), public authorities, senior official and managers (31.5% and 24%), clerical support workers (22.5 % and 21.1%) and technicians (27.3% for moderate impact), though the latter stand out with notably lower expectations of a significant impact (14.4%). This might be due to the inherent complexity of many tasks in this professional group. In comparison, relatively few respondents predict a complete transformation of their occupations, with the highest share of such responses among service and sales workers (5.1%) and clerical support workers (4.2%), and a small total number of these observations.</p>
            <p class="Caption-Image">Figure 7. Expectations of impact on the work area</p>
            <p>
              <img width="100%" class="standard-img" src="chapter-03_-image6.png" />
            </p>
            <p>We further examine these trends by asking respondents a more personal question, related to their perceived likelihood of GenAI replacing their current job in the next five years. For most professions, responses are clustered at the lower end of the risk spectrum, suggesting limited concern about replacement by GenAI in the mid-term (Figure 8). However, among clerical support workers, the density of responses representing moderate to high levels of concern is noticeably higher, with women reporting slightly higher risks compared to men, while the converse is observed among plant and machine operators and assemblers.</p>
            <p class="Caption-Image">Figure 8. Expectations of impact on individuals’ current job – distribution of individual scores</p>
            <p>
              <img width="100%" class="standard-img" src="chapter-03_-image7.png" />         </p>
            <h3>3.5.3. Scoring of task automation potential</h3>
            <p>The survey asked respondents to evaluate the extent to which GenAI could automate the execution of various tasks (see Text Box 1). As shown in Figure 9, responses reveal gendered scoring that aligns with occupational segregation. For example, the scores provided by clerical support workers are predominantly from women, reflecting the high representation of women in this occupational group. However, men within this occupation tend to assign higher scores, potentially reflecting a different perception of task automatability or biases regarding clerical work, despite their lower representation in this group. Conversely, men dominate responses in occupations such as craft and trade workers and plant and machine operators, but for the tasks in these occupations, they assign lower scores than women. These differences may be representative of different task composition or even tasks performed by men and women, even when in the same occupational category, which then influence their scoring.</p>
            <p class="Caption-Image">Figure 9. Distribution of task-level scores by sex and occupational group (1-digit ISCO-08)</p>
            <p>
              <img width="100%" class="standard-img" src="chapter-03_-image8.png" />         </p>
            <p>To better understand the factors associated with higher task automation scores, we conducted a set of exploratory regressions using the main task-level score as the dependent variable and controlling for occupational clustering. Results suggest that across occupations, familiarity with a task is associated with higher scores, and this relationship strengthens with greater reported exposure to GenAI. Respondents who use GenAI frequently – such as on a daily or weekly basis – tend to assign higher scores. Similarly, those who believe GenAI will have a “Complete” or “Significant Impact” on their occupation consistently assign the highest task scores (Figure 10).<span class="footnote-box" onclick="footnotePop(fnID0EUJAG)" xmlns:mml="http://www.w3.org/1998/Math/MathML">8</span></p>
            <p class="Caption-Image">Figure 10. Scoring as a function of familiarity with GenAI and the scored task – distribution of individual scores</p>
            <p>
              <img width="100%" class="standard-img" src="chapter-03_-image10.png" />      </p>
            <p>One way to address this variation in scoring would be to apply corrective weights to responses, giving greater influence to respondent profiles likely to have more relevant expertise. For example, one could assign more weight to respondents reporting greater familiarity with GenAI or frequent usage or prioritize scores from individuals who perform similar tasks in their daily work. However, in our sample, this would introduce significant limitations. For 91.5% of the tasks, respondents did not report performing a similar task in their work – even when the task belonged to the same 1-digit occupational group as their current job. This is not surprising. For instance, within the “Professionals” group alone, the representative sample consisted of 368 tasks drawn from a pool of 8,715 tasks (Table 2), making exact task matching unlikely.</p>
            <p>Moreover, adjusting for beliefs or usage would require strong theoretical assumptions about what constitutes “credible” scoring. For example, a respondent who believes their profession will be completely transformed by GenAI in the next five years may be highly informed, or may be expressing anxiety, speculation, or dystopian fears. Without richer data to distinguish between these interpretations, applying corrective weights risks introducing new biases.</p>
            <p>Given the relatively small size of these specific subgroups in our dataset, we refrain from implementing such adjustments in the current analysis to avoid overfitting or compromising credibility. Instead, we flag this as an important area for future survey design, particularly in capturing respondent expertise and task familiarity more systematically.</p>
            <p>For the present study, we treat the survey as a starting point, designed to capture a broad spectrum of perspectives reflecting varying degrees of familiarity with both tasks and GenAI. In many cases, a respondent’s understanding of the task itself may be more influential than their understanding of the technology, especially for concrete physical tasks (e.g. trimming flowers, assembling mechanical parts). Accordingly, we rely on mean scores across all respondents to reflect the collective judgment of a diverse sample grounded in workplace experience. To enhance robustness, we supplement this with expert evaluation of a subset of tasks (section 5), ensuring that final scores reflect both practical insights and a realistic appraisal of current GenAI capabilities.</p>
          </section>
        </section>
        <section id="ID0EWYAG">
          <a id="ID0EYYAG"> </a>
          <h1>Expert validation survey </h1>
          <p>The expert group includes international specialists at the ILO and its partner organizations, NASK and the Polish Ministry of Family, Labour and Social Policy.<span class="footnote-box" onclick="footnotePop(fnID0EKKAG)" xmlns:mml="http://www.w3.org/1998/Math/MathML">9</span> The primary criterion for expert selection is their understanding of labour markets, including the complexity of occupations and tasks, and their real-life applications. While the experts are expected to have familiarity with the current family of generative AI technologies and their applications, expertise in AI design or development is not a requirement. This approach ensures that the focus remains on the feasibility and practical implications of automation within existing technological constraints, as  technology experts tend to overstate technological capacities and risks when evaluating broader applications, particularly in workplace settings (<field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;eryEZvfv&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Karger et al., 2023)&quot;,&quot;plainCitation&quot;:&quot;(Karger et al., 2023)&quot;,&quot;dontUpdate&quot;:true,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:50186,&quot;uris&quot;:[&quot;http://zotero.org/groups/4848274/items/7B9QU7CB&quot;],&quot;itemData&quot;:{&quot;id&quot;:50186,&quot;type&quot;:&quot;report&quot;,&quot;collection-title&quot;:&quot;FRI Working Paper #1&quot;,&quot;publisher&quot;:&quot;Forecasting Research Institute&quot;,&quot;title&quot;:&quot;Forecasting Existential Risks: Evidence from a Long-Run Forecasting Tournament&quot;,&quot;URL&quot;:&quot;https://static1.squarespace.com/static/635693acf15a3e2a14a56a4a/t/64abffe3f024747dd0e38d71/1688993798938/XPT.pdf&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Karger&quot;,&quot;given&quot;:&quot;Ezra&quot;},{&quot;family&quot;:&quot;Rosenberg&quot;,&quot;given&quot;:&quot;Josh&quot;},{&quot;family&quot;:&quot;Jacobs&quot;,&quot;given&quot;:&quot;Zachary&quot;},{&quot;family&quot;:&quot;Hickman&quot;,&quot;given&quot;:&quot;Molly&quot;},{&quot;family&quot;:&quot;Hadshar&quot;,&quot;given&quot;:&quot;Rose&quot;},{&quot;family&quot;:&quot;Gamin&quot;,&quot;given&quot;:&quot;Kayla&quot;},{&quot;family&quot;:&quot;Smith&quot;,&quot;given&quot;:&quot;Taylor&quot;},{&quot;family&quot;:&quot;Williams&quot;,&quot;given&quot;:&quot;Bridget&quot;},{&quot;family&quot;:&quot;McCaslin&quot;,&quot;given&quot;:&quot;Tegan&quot;},{&quot;family&quot;:&quot;Tetlock&quot;,&quot;given&quot;:&quot;Philip E.&quot;}],&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2023&quot;,7,10]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">Karger et al., 2023)</field>. This tendency is evident in earlier automation studies, which often assigned high displacement potential to routine tasks or entire occupations, such as garment production. As de Mattos et al. (2020) illustrate, these technological predictions frequently failed to account for the challenges of automating tasks requiring high dexterity or handling complex materials, such as stitching pliable fabrics. Accordingly, the assessment of automation potential in our study prioritizes expertise of task execution and workplace realities over purely technological expertise.</p>
          <p>Since the experts cannot review all 2,861 tasks used in the survey, we focus on a representative sub-sample, selected in such a way to subsequently permit adjustments to entire task clusters. The overall scheme of this score adjustment procedure is presented in Figure 11.</p>
          <p class="Caption-Image">Figure 11. Schema of the scoring stages</p>
          <p>
            <img width="100%" class="standard-img" src="chapter-04-image5.png" />
          </p>
          <p>First, we cluster the tasks into four fixed intervals, based on the distribution of the mean scores from the survey.<span class="footnote-box" onclick="footnotePop(fnID0E2KAG)" xmlns:mml="http://www.w3.org/1998/Math/MathML">10</span> We then use hierarchical clustering to group similar tasks within those clusters based on their semantic content. First, we assign embeddings to each task description using the <i>text-embedding-ada-002</i> model from OpenAI. Next, for each subgroup – defined by the combination of an occupational group at ISCO-08 1-digit level and a particular survey score cluster – we perform Ward’s hierarchical clustering.<span class="footnote-box" onclick="footnotePop(fnID0EALAG)" xmlns:mml="http://www.w3.org/1998/Math/MathML">11</span> We generate a dendrogram for each subgroup, plotting the tasks along the horizontal axis and the linkage distances (or “heights”) along the vertical axis. Clusters are then formed by “cutting” the dendrogram at a chosen linkage height, such that every branch below this cut line becomes its own cluster (Figure 12). </p>
          <p>In our approach, we select the height threshold manually for each subgroup through visual inspection of the dendrogram. This allows us to flexibly accommodate heterogeneity among subgroup’s tasks, so as to ensure that each final cluster contains tasks that are genuinely similar in content. Once the distance threshold is determined, all tasks in the subgroup are assigned to a unique cluster. The process is repeated for each occupation–score-cluster combination. Although our visual inspection introduces an element of subjective judgment, it ensures that spurious or extremely fine-grained splits are avoided, helping to maintain coherent groupings of tasks for the subsequent expert review.</p>
          <p class="Caption-Image">Figure 12. Example of a dendogram used for the review of tasks’ semantic clustering</p>
          <p>
            <img width="100%" class="standard-img" src="chapter-04-image6.png" />
          </p>
          <p>Once each task had been assigned to a cluster, based on its 1-digit occupational group, scoring bracket from the survey and the semantic similarity of tasks, we generate the final sample of tasks for expert review. To ensure coverage across all clusters while limiting the total burden on experts, we applied a scaling factor (set to 20%) to determine the approximate fraction of tasks to sample from each group.<span class="footnote-box" onclick="footnotePop(fnID0ENLAG)" xmlns:mml="http://www.w3.org/1998/Math/MathML">12</span> We then enforced a minimum of one task per cluster (to avoid excluding smaller clusters entirely) and a maximum of five tasks per cluster to keep the workload manageable. Through this procedure, we achieve a balanced, yet compact, sample that captures semantic diversity while preventing over-sampling from any single cluster. We retain the cluster assignment for each task, so that the expert review can be subsequently looped back into adjustments of the scores in the cluster that the sampled task originated from. </p>
          <p>Each of the selected 608 tasks was then presented to a panel of experts. For each task, the experts were shown (i) the occupation and cluster information, (ii) the average survey score (rescaled to 0–1), and (iii) the full task description. If they agreed with the survey score, they left it unchanged; otherwise, they entered a revised expert score (0–1). </p>
          <p>In many cases, the differences between the survey and expert scores are non-trivial. They also vary significantly across occupational groups, revealing distinct patterns based on the nature of pertaining tasks (Figure 13). In occupations dominated by manual and physical tasks, such as Craft and Related Trades Workers, Plant and Machine Operators, and Farmers, Gardeners, Foresters, and Fishers, experts consistently assigned lower scores compared to the survey respondents, reflecting the practical limitations of automating tasks that require physical manipulation or manual dexterity. In contrast, occupations involving more cognitive or knowledge-intensive tasks, such as Clerical Support Workers and Professionals, show a much more mixed picture. While some tasks in these groups received lower scores, many others were revised upwards by the expert group, reflecting the greater adaptability of generative AI for structured, data-driven, or communication-focused tasks. For example, Clerical Support Workers display a combination of increases and decreases, suggesting nuanced task-specific assessments where automation potential depends heavily on the nature of individual tasks.</p>
        </section>
        <section id="ID0E63AG">
          <a id="ID0EB4AG"> </a>
          <h1>Adjustment of survey sub-sample </h1>
          <p>In the next step, we compared the average of expert scores with the original mean survey scores using two independent AI models as impartial arbiters to propose an adjusted score.<span class="footnote-box" onclick="footnotePop(fnID0E1LAG)" xmlns:mml="http://www.w3.org/1998/Math/MathML">13</span> The models were informed about the sources of the scores in such a way that would prevent them from automatically siding with the expert group: group one was defined as “<i>practical knowledge of the work and types of tasks they were presented, since they worked in the same occupational groups from which we selected tasks they scored</i>”, while the second group was described as “<i>respondents with more theoretical knowledge of technology and labour markets</i>”. Rather than simply averaging the two scores, the models were explicitly instructed to focus their analysis on the task characteristics and the current capabilities of generative AI and required to provide justifications for each adjustment and its relative position to the original scores. </p>
          <p class="Caption-Image">Figure 13. Task-level scores from the survey and experts, compared to AI-arbitrated scores</p>
          <p>
            <img width="100%" class="standard-img" src="chapter-05-image1.png" />
          </p>
          <p>The overall correlation between the adjusted scores produced by the two AI models is 0.96, with correlations within occupational groups exceeding 0.9 in all but one case<span class="footnote-box" onclick="footnotePop(fnID0EKMAG)" xmlns:mml="http://www.w3.org/1998/Math/MathML">14</span> (Figure 14). This high level of agreement demonstrates that, when provided with sufficient background knowledge in the form of reference ranges of scores, the models converge on remarkably similar predictions. Notably, only three tasks exhibited an absolute difference in scores exceeding 0.2 (orange dots in Figure 13). In these cases, GPT-4o tended to adopt a more optimistic perspective on the feasibility of automation, whereas Gemini emphasized the importance of human judgment as a critical factor.</p>
          <p class="Caption-Image">Figure 14. Comparison of Adjusted Scores: GPT-4o vs Gemini by Occupational Group</p>
          <p>
            <img width="100%" class="standard-img" src="chapter-05-image2.png" />
          </p>
          <p>For the final adjustment, we averaged the scores of the two arbitrating models and manually reviewed the justifications, without observing any significant inconsistencies. Table 4 illustrates the result of the adjustment process through examples of tasks where expert scores were significantly higher or lower than the survey averages, with the final adjusted score and GPT-4o justification. For tasks such as “<i>operating injection molding machines” or “performing mechanical processing of silicon</i>”, experts highlighted the limitations of generative AI in handling physical and manual components, leading to significantly reduced adjusted scores compared to the survey. Conversely, for tasks like “<i>maintaining documentation of classes with children</i>” or “<i>performing financial estimates for household budgets</i>”, the experts recognized the structured and analytical nature of these tasks, which generative AI can assist with to a substantial degree.</p>
