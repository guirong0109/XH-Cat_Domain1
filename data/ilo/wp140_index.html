        <section id="ID0EFFBG">
          <a id="ID0EHFBG"> </a>
          <h1>Adjustment of all survey scores </h1>
          <p>After adjusting the 608 tasks for which we had both survey scores and expert evaluations, we proceeded to predict adjustments for the remaining 2,253 tasks (2,861 minus 608) scored in the initial survey. Each of these tasks is linked to a reference cluster and semantically similar tasks that were reviewed and adjusted in the earlier steps (see Sections 5 and 6). To ensure consistency, the AI models were provided with the context of already adjusted scores from semantically similar tasks within the same occupational group and scoring bracket. Following the methodology outlined in Section 6, we utilized two independent AI models to generate predictions, achieving a correlation coefficient of 0.95 across all data points. The final predicted scores were determined as the mean of the two model outputs. </p>
          <p class="Caption-Image">Figure 15. Survey scores, expert evaluation and final adjustments for 2,861 tasks in the main survey</p>
          <p>
            <img width="100%" class="standard-img" src="chapter-06-image1.png" />       </p>
          <p>Figure 15 shows all 2,861 tasks scored in the main survey, arranged on the horizontal axis in ascending order of their initial survey scores. Each panel represents a different occupational group. Red points indicate the mean scores derived from survey responses, while purple diamonds represent expert evaluations for tasks where such scores were available. Orange squares show the final adjusted scores, based on the AI-driven reconciliation of survey and expert evaluations for tasks with both inputs, and green triangles represent AI-based predictions for tasks without expert scores, using reference scores from the corresponding cluster as context. The blue lines illustrate the overall trend among the final scores (a mix of adjusted and predicted scores), with a notable lowering of scores for more manual tasks.</p>
        </section>
        <section id="ID0EFHBG">
          <a id="ID0EHHBG"> </a>
          <h1>Prediction of synthetic task-level scores for all ISCO-08 and 6-digit occupations </h1>
          <p>As the final step, we use the adjusted survey scores for 2,861 tasks to develop an AI assistant capable of predicting synthetic scores for new tasks across various classification systems. This combines the strengths of human expertise with generative AI’s ability to generate consistent, large-scale responses based on precise instructions.</p>
          <p class="Caption-Box">Text Box 3. The conceptual structure of the LLM prompt (Python code for GPT-4o) </p>
          <p>
            <img width="100%" class="standard-img" src="chapter-07-image2.png" />
          </p>
          <p>To develop our predictive model, we evaluated two approaches: (i) fine-tuning a large language model (LLM) with the 2,861-task dataset or (ii) designing an advanced prompting strategy (prompt engineering). Fine-tuning, while promising for learning domain-specific patterns, is resource-intensive and limited by our relatively small dataset.<span class="footnote-box" onclick="footnotePop(fnID0EDTAG)" xmlns:mml="http://www.w3.org/1998/Math/MathML">15</span> In contrast, by using a sufficiently large set of example tasks within the prompt, we can provide the model with explicit “demonstrations” of scoring of similar tasks in our main dataset. To ensure a balanced approach, we provide each prompt with a sample of tasks with the highest 50 and lowest 50 scores, alongside the scores of 30 tasks with greatest semantic similarity to the tasks that the model is requested to score. To create the semantic context, we construct a rapid-search vector database with all 2,861 adjusted scores. The database is queried at the start of each API call and extracts tasks with semantic similarity to the task that is being scored. Once the 30 most similar tasks have been retrieved, a set of complete instructions is passed to the model’s API, as per the general prompt strategy illustrated in Box 3.</p>
          <p>We first validate the predictive model using a sample of tasks from the survey that were adjusted as per sections 5-7, but not included in the semantic context provided to the model.<span class="footnote-box" onclick="footnotePop(fnID0EPTAG)" xmlns:mml="http://www.w3.org/1998/Math/MathML">16</span> Once the prompt adjustments deliver satisfactory performance, we use the same system to predict automation scores for 3,265 tasks in ISCO-08 (as in Gmyrek et al., 2023).<span class="footnote-box" onclick="footnotePop(fnID0ESTAG)" xmlns:mml="http://www.w3.org/1998/Math/MathML">17</span> This approach bridges expert-validated human assessments with the scalability of LLM-based predictions, enabling consistent and extensible scoring for tasks across classification systems. </p>
          <p>For a further refinement of our scoring system, we filter 364 tasks where the scoring in 2025 changed by more than 25% of the absolute value of 2023 score. We review these tasks manually, using an expert consensus-building method. First, we conduct a mini survey among co-authors, in which each respondent is asked to arbitrate between the diverging scores. For 64 ISCO-08 tasks, where we still observe a divergence of expert opinions, we conduct a detailed group discussion, in order to reach consensus and agree on a justification. </p>
          <p>Following the final manual verification process, we establish a second knowledge repository, also stored in a vector database. The main LLM prompt is then updated to incorporate this additional reference by conducting two sequential semantic context retrievals for each prediction, further improving the model’s precision in predicting scores for new tasks. Using this approach, we generate predictions for all 29,753 tasks in the Polish classification system (Table 1). </p>
          <p>To compare these 6-digit predictions with 4-digit ISCO-08 classifications, we calculate (i) the mean of all task scores aggregated at the 4-digit level and (ii) occupational means at the 6-digit level, subsequently deriving the 4-digit mean from these 6-digit components. In both cases, the correlation between predictions based on ISCO-08 tasks and Polish 6-digit tasks is 0.92, demonstrating exceptional stability of predictions. In other words, while one might question the exact scores assigned to tasks in our knowledge repository – a challenge not unique to our study – once the repository and prompting techniques are in place, the model consistently produces stable predictions based on reference tasks and their scores, and irrespective of the occupational classification system. This approach offers promising possibilities for replication across other occupational classifications, which we intend to explore further. For the remainder of this paper, we focus primarily on revising ISCO-08 scores, leaving a detailed analysis of Poland’s 6-digit occupations for a separate study (Gmyrek et al., forthcoming, 2025).</p>
        </section>
        <section id="ID0EAKBG">
          <a id="ID0ECKBG"> </a>
          <h1>Adjusted Global Index of GenAI Exposure </h1>
          <p>To classify ISCO-08 occupations into varying levels of exposure to Generative AI (GenAI), we update the framework introduced in Gmyrek et al. (2023). Similarly to the original approach, we rely on two moments of distribution: occupational mean and standard deviation (SD) of task-level scores pertaining to a given 4-digit occupation. However, instead of using automation and augmentation potential as two extreme categories with the "big unknown" in between, we now adopt a more nuanced classification scheme that represents a spectrum of exposure, with occupations considered as exposed classified into four increasing gradients (Figure 16 and Table 5). </p>
          <p class="Caption-Image">Figure 16. AI Exposure Gradients: ISCO-08 4-digit level occupations</p>
          <p class="source-text">
            <img width="100%" class="standard-img" src="chapter-08-image1.png" />     </p>
          <p class="source-text">Note: Figure 16 presents all ISCO-08 4-digit occupations classified into GenAI exposure categories as per the criteria in Table 5. A detailed list of occupation-level means and SDs is available in the Appendix, Table A1. In addition, task-level scores within the overall hierarchy of ISCO-08 are available here: <a target="_blank" href="https://pgmyrek.github.io/2025_GenAI_scores_ISCO08/"><span class="Hyperlink">https://pgmyrek.github.io/2025_GenAI_scores_ISCO08/</span></a></p>
          <p>Gradient 1 represents occupations with low overall GenAI exposure but significant variability across tasks (Low exposure, high task variability). While some tasks within these roles may have high automation potential, the occupation has many tasks that continue requiring human roles, aligning closely with the notion of augmentation in the old framework. Gradient 2 includes occupations with moderate GenAI exposure and a mix of highly exposed and minimally exposed tasks, resulting in uneven impacts where some tasks may be disrupted while others remain unaffected (Moderate exposure, high task variability). Gradient 3 captures occupations where a significant portion of tasks are consistently exposed to GenAI, signaling growing automation risks and requiring adaptation strategies for workers (Significant exposure, high task variability). Gradient 4 highlights occupations with the highest share of tasks exposed to potential GenAI-driven automation, and with a high consistency of this exposure across tasks (Highest exposure, low task variability). This gradient aligns closely with the notion of automation risk in our earlier classification system <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;MNniWiIe&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Gmyrek et al., 2023)&quot;,&quot;plainCitation&quot;:&quot;(Gmyrek et al., 2023)&quot;,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:50384,&quot;uris&quot;:[&quot;http://zotero.org/groups/4848274/items/RLX2P6B7&quot;],&quot;itemData&quot;:{&quot;id&quot;:50384,&quot;type&quot;:&quot;report&quot;,&quot;abstract&quot;:&quot;This study assesses the potential global exposure of occupations to Generative AI, particularly GPT-4. It predicts that the overwhelming effect of the technology will be to augment occupations, rather than to automate them. The greatest impact is likely to be in high and upper-middle income countries due to a higher share of employment in clerical occupations. As clerical jobs are an important source of female employment, the effects are highly gendered. Insights from this study underline the need for proactive policies that focus on job quality, ensure fair transitions, and that are based on dialogue and adequate regulation.&quot;,&quot;genre&quot;:&quot;Working paper&quot;,&quot;language&quot;:&quot;en&quot;,&quot;license&quot;:&quot;Copyright and permissions © 1996-2023 International Labour Organization - /global/copyright/lang--en/index.htm&quot;,&quot;note&quot;:&quot;ISBN: 9789220395356&quot;,&quot;source&quot;:&quot;www.ilo.org&quot;,&quot;title&quot;:&quot;Generative AI and Jobs: A global analysis of potential effects on job quantity and quality&quot;,&quot;title-short&quot;:&quot;Generative AI and Jobs&quot;,&quot;URL&quot;:&quot;http://www.ilo.org/global/publications/working-papers/WCMS_890761/lang--en/index.htm&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Gmyrek&quot;,&quot;given&quot;:&quot;Pawel&quot;},{&quot;family&quot;:&quot;Berg&quot;,&quot;given&quot;:&quot;Janine&quot;},{&quot;family&quot;:&quot;Bescond&quot;,&quot;given&quot;:&quot;David&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2023&quot;,10,30]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2023&quot;,8,21]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">(Gmyrek et al., 2023)</field>. In addition, among occupations outside these four categories, we introduce a more granular distinction of Minimal Exposure, where some interaction with GenAI may occur, but without significantly altering the nature of these roles, and the lowest category of Not Exposed occupations, where GenAI currently has no observable potential to automate tasks.</p>

                </td>

          </table>
          <p>This revised framework addresses some limitations of the earlier categorization system, particularly the interpretative challenges posed by the category, “the big unknown". By expanding the exposure categories into a continuous gradient, the updated framework improves the readability and interpretability of results and enables us to stack employment estimates into the overall category of exposed occupations (Figure 17 in Section 10).<span class="footnote-box" onclick="footnotePop(fnID0EKYAG)" xmlns:mml="http://www.w3.org/1998/Math/MathML">18</span> It also captures in a more nuanced way how GenAI can impact occupations at varying levels of exposure, based on task-level variability and overall occupational risks. Furthermore, the framework's flexibility enhances its applicability to country-specific contexts, allowing policymakers to better understand the distribution of GenAI's potential impact and prioritize interventions for the most affected groups in the national contexts.</p>
          <p>We stress that these classifications merely suggest the general trends and types of occupations at different levels of exposure, since any type of task scoring system carries a degree of subjectivity. While the abilities of GenAI and its derivative technologies evolve rapidly, many additional local factors, not covered in this global study, can either speed up and expand, or limit the impact of these technologies on specific occupations. The advantage of this more detailed categorization of occupations into four progressive gradients is that it will allow for tracking the movement of occupations over time, and for occupational-level comparisons across national classification systems with varying collections of tasks.<span class="footnote-box" onclick="footnotePop(fnID0EPYAG)" xmlns:mml="http://www.w3.org/1998/Math/MathML">19</span></p>
        </section>
        <section id="ID0EGPBG">
          <a id="ID0EIPBG"> </a>
          <h1>Changes to occupational classifications </h1>
          <p>Our 2025 task-level scores are broadly consistent with those of the ILO 2023 study <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;hwIwtUh5&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Gmyrek et al., 2023)&quot;,&quot;plainCitation&quot;:&quot;(Gmyrek et al., 2023)&quot;,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:50384,&quot;uris&quot;:[&quot;http://zotero.org/groups/4848274/items/RLX2P6B7&quot;],&quot;itemData&quot;:{&quot;id&quot;:50384,&quot;type&quot;:&quot;report&quot;,&quot;abstract&quot;:&quot;This study assesses the potential global exposure of occupations to Generative AI, particularly GPT-4. It predicts that the overwhelming effect of the technology will be to augment occupations, rather than to automate them. The greatest impact is likely to be in high and upper-middle income countries due to a higher share of employment in clerical occupations. As clerical jobs are an important source of female employment, the effects are highly gendered. Insights from this study underline the need for proactive policies that focus on job quality, ensure fair transitions, and that are based on dialogue and adequate regulation.&quot;,&quot;genre&quot;:&quot;Working paper&quot;,&quot;language&quot;:&quot;en&quot;,&quot;license&quot;:&quot;Copyright and permissions © 1996-2023 International Labour Organization - /global/copyright/lang--en/index.htm&quot;,&quot;note&quot;:&quot;ISBN: 9789220395356&quot;,&quot;source&quot;:&quot;www.ilo.org&quot;,&quot;title&quot;:&quot;Generative AI and Jobs: A global analysis of potential effects on job quantity and quality&quot;,&quot;title-short&quot;:&quot;Generative AI and Jobs&quot;,&quot;URL&quot;:&quot;http://www.ilo.org/global/publications/working-papers/WCMS_890761/lang--en/index.htm&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Gmyrek&quot;,&quot;given&quot;:&quot;Pawel&quot;},{&quot;family&quot;:&quot;Berg&quot;,&quot;given&quot;:&quot;Janine&quot;},{&quot;family&quot;:&quot;Bescond&quot;,&quot;given&quot;:&quot;David&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2023&quot;,10,30]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2023&quot;,8,21]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">(Gmyrek et al., 2023)</field>, although the mean scores at the level of occupations are slightly lower (0.29 in 2025 compared to 0.30 in 2023). However, the score dispersion within occupations is considerably narrower, resulting in a more concentrated overall distribution (Figure 3).</p>
          <p class="Caption-Image">Figure 17. AI Exposure: Comparison of 2025 with 2023, ISCO -08 4-digit level occupations</p>
          <p>
            <img width="100%" class="standard-img" src="chapter-09-image1.png" />      </p>
          <p>Similar to our 2023 study, clerical occupations exhibit the highest levels of exposure, though with a decline in their mean scores due to a reassessment of certain task-level evaluations (Figures 18 &amp; 19). This decrease highlights the distinction between the theoretical automation potential of a task and the practical insights gained from two years of experimentation with GenAI tools. While tasks such as taking meeting notes or scheduling appointments can significantly benefit from GenAI support, our 2023 scores for such tasks, which reached 0.9 in some cases, reflected an overly optimistic assessment of full automation potential. In reality, many of these tasks still require substantial human effort. Despite the decline in overall mean scores for these occupations, many still fall within the highest exposure gradient (Level 4), since the final classification does not depend solely on the mean score but is determined through a simultaneous assessment of each occupation’s mean and the dispersion of corresponding task-level scores (SD, see Figure 16 and Table 5). Among the 13 occupations classified in gradient 4, the majority represent clerical roles, including data entry clerks, typists and word processing operators, accounting and bookkeeping clerks, and general office clerks.</p>
          <p class="Caption-Image">Figure 18. Changes to occupational exposure between 2023 and 2025 within Gradient 4</p>
          <p>
            <img width="100%" class="standard-img" src="chapter-09-image2.png" />      </p>
          <p>On the other hand, several highly digitized occupations have seen an increase in their mean scores. This applies, for example, to web and media developers, statistical and database specialists, as well as financial and software-related occupations (Figure 17). A key factor behind this shift is the rapid expansion of AI capabilities since our previous study in 2023. At that time, large language models (LLMs) were primarily viewed as advanced text generators. Since then, they have acquired multimodal abilities, allowing them to process and generate not only text but also images, audio, and video. Additionally, these models have been gaining some agentic capabilities, allowing them to execute multi-step tasks autonomously, interact with software environments, and make decisions based on contextual inputs. These advancements significantly broaden the scope of tasks that can be at least partially automated using GenAI, with software development and multimedia sectors among some of the leading adopters.</p>
          <p>While many of these occupations fall within gradient 3 and 4, one must consider that these roles are deeply intertwined with digital technologies, and indeed, many of these occupations have emerged as a result of technological advancements. The scores reflect the high potential of automation among their current tasks, but these occupations also possess a strong capacity to evolve and develop new tasks through innovative application of GenAI and related digital tools. In previous technological transitions, this type of adaptation was exemplified by the well-known case of bank tellers following the diffusion of automatic teller machines (ATMs) in the 1990s <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;KXV4Bi21&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Bessen, 2016)&quot;,&quot;plainCitation&quot;:&quot;(Bessen, 2016)&quot;,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:49864,&quot;uris&quot;:[&quot;http://zotero.org/groups/4848274/items/3WZ8YZBL&quot;],&quot;itemData&quot;:{&quot;id&quot;:49864,&quot;type&quot;:&quot;article-journal&quot;,&quot;abstract&quot;:&quot;This paper investigates basic relationships between technology and occupations. Building a general occupational model, I look at detailed occupations since 1980 to explore whether computers are related to job losses or other sources of wage inequality. Occupations that use computers grow faster, not slower. This is true even for highly routine and mid-wage occupations. Estimates reject computers as a source of significant net technological unemployment or job polarization. But computerized occupations substitute for other occupations, shifting employment and requiring new skills. Because new skills are costly to learn, computer use is associated with substantially greater within-occupation wage inequality.&quot;,&quot;DOI&quot;:&quot;10.2139/ssrn.2690435&quot;,&quot;language&quot;:&quot;en&quot;,&quot;source&quot;:&quot;Social Science Research Network&quot;,&quot;title&quot;:&quot;How Computer Automation Affects Occupations: Technology, Jobs, and Skills&quot;,&quot;title-short&quot;:&quot;How Computer Automation Affects Occupations&quot;,&quot;URL&quot;:&quot;https://papers.ssrn.com/abstract=2690435&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Bessen&quot;,&quot;given&quot;:&quot;James E.&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2023&quot;,6,9]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2016&quot;,10,3]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">(Bessen, 2016)</field>. As ATMs automated routine cash withdrawals, they also lowered operational costs, enabling banks to open more branches and, in turn, increasing the demand for bank tellers in roles that required more complex customer service and advisory tasks. One can therefore expect many tasks in these occupations not to remain static but rather to evolve alongside technological advancements, driven by the expanding capabilities of GenAI. A key question – largely dependent on the policies shaping this evolution – is to what extent these jobs can retrain and retain existing workers, rather than drive labor churn through workforce replacement and the recruitment of typically younger specialists <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;sUuVKs0s&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Ananian et al., 2006)&quot;,&quot;plainCitation&quot;:&quot;(Ananian et al., 2006)&quot;,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:50767,&quot;uris&quot;:[&quot;http://zotero.org/groups/5406503/items/EZVMJ23P&quot;],&quot;itemData&quot;:{&quot;id&quot;:50767,&quot;type&quot;:&quot;article-journal&quot;,&quot;abstract&quot;:&quot;Ältere Arbeitnehmer, neue Technologien und organisatorische Veränderungen Eine neue Untersuchung anhand der Erhebung Antwort Wenn Unternehmen der technologischen Innovation (Mikrocomputer, Internet) organisatorische Veränderungen vornehmen oder sich dem internationalen Markt öffnen, stellt sich die Frage nach der Anpassung der älteren Arbeitnehmer (Senioren) entlassen die betreffenden Unternehmen häufi ger Senioren oder nicht? Die Analyse des Beschäftigungsstocks des Jahres 1998 bestätigt die Hypothese einer Verzerrung solcher Veränderungen zum Nachteil der Senioren. In der Industrie wie auch im tertiären Sektor beschäftigen die Unternehmen mit einem hohen Informatisierungsgrad oder mit innovativen organisatorischen Praktiken vergleichsweise weniger Senioren. Insgesamt trifft dies sowohl auf die Qualifi ziertesten (Führungskräfte und mittleres Management) wie auch auf die am wenigsten Qualifi zierten (Arbeiter oder Angestellte) zu. Die kausale Beziehung zwischen Innovation und Beschäftigung der ältesten Arbeitnehmer lässt sich aufgrund ihrer Komplexität nur schwer aufzeigen. Die Analyse der Beschäftigungsströme zwischen 1998 und 2001 bestätigt jedoch, dass Innovationen die Qualifi kationen in stärkerem Maße obsolet machen. Die neuen Technologien, die bei der Rekrutierung wie auch beim Ausscheiden aus einem Unternehmen eine Rolle spielen, würden sich auf die Beschäftigung der Senioren negativ auswirken. Allerdings muss diese Feststellung nuanciert werden; denn bestimmte organisatorische Veränderungen wie die Dezentralisierung der Entscheidungsbefugnisse und die Öffnung hin zum internationalen Markt erfordern erfahrene Arbeitnehmer und begünstigen deshalb eher die Älteren als die Jüngeren.&quot;,&quot;container-title&quot;:&quot;Economie et Statistique&quot;,&quot;DOI&quot;:&quot;10.3406/estat.2006.7125&quot;,&quot;issue&quot;:&quot;1&quot;,&quot;language&quot;:&quot;fre&quot;,&quot;license&quot;:&quot;free&quot;,&quot;note&quot;:&quot;Company: Persée - Portail des revues scientifiques en SHS\nDistributor: Persée - Portail des revues scientifiques en SHS\nInstitution: Persée - Portail des revues scientifiques en SHS\nLabel: Persée - Portail des revues scientifiques en SHS\npublisher: Institut national de la statistique et des études économiques&quot;,&quot;page&quot;:&quot;21-49&quot;,&quot;source&quot;:&quot;www.persee.fr&quot;,&quot;title&quot;:&quot;Travailleurs âgés, nouvelles technologies et changements organisationnels : un réexamen à partir de l'enquête « Reponse ». Suivi d'un commentaire de Luc Behaghel : emploi des seniors - Des effets du changement technologique aux recommandations&quot;,&quot;title-short&quot;:&quot;Travailleurs âgés, nouvelles technologies et changements organisationnels&quot;,&quot;volume&quot;:&quot;397&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Ananian&quot;,&quot;given&quot;:&quot;Sévane&quot;},{&quot;family&quot;:&quot;Aubert&quot;,&quot;given&quot;:&quot;Patrick&quot;},{&quot;family&quot;:&quot;Behaghel&quot;,&quot;given&quot;:&quot;Luc&quot;}],&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2006&quot;]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">(Ananian et al., 2006)</field>.</p>

        <section id="ID0EGUBG">
          <a id="ID0EIUBG"> </a>
          <h1>Revised global employment estimates </h1>
          <p>Having established a comprehensive list of 4-digit occupations with corresponding GenAI exposure scores (Appendix A, Table A1), we focus on the 112 occupations identified as exposed and estimate the share of employment that these occupations represent at the global, regional, and income-based levels. We apply the same method as in <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;ff5zdyeh&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Gmyrek et al., 2023)&quot;,&quot;plainCitation&quot;:&quot;(Gmyrek et al., 2023)&quot;,&quot;dontUpdate&quot;:true,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:50384,&quot;uris&quot;:[&quot;http://zotero.org/groups/4848274/items/RLX2P6B7&quot;],&quot;itemData&quot;:{&quot;id&quot;:50384,&quot;type&quot;:&quot;report&quot;,&quot;abstract&quot;:&quot;This study assesses the potential global exposure of occupations to Generative AI, particularly GPT-4. It predicts that the overwhelming effect of the technology will be to augment occupations, rather than to automate them. The greatest impact is likely to be in high and upper-middle income countries due to a higher share of employment in clerical occupations. As clerical jobs are an important source of female employment, the effects are highly gendered. Insights from this study underline the need for proactive policies that focus on job quality, ensure fair transitions, and that are based on dialogue and adequate regulation.&quot;,&quot;genre&quot;:&quot;Working paper&quot;,&quot;language&quot;:&quot;en&quot;,&quot;license&quot;:&quot;Copyright and permissions © 1996-2023 International Labour Organization - /global/copyright/lang--en/index.htm&quot;,&quot;note&quot;:&quot;ISBN: 9789220395356&quot;,&quot;source&quot;:&quot;www.ilo.org&quot;,&quot;title&quot;:&quot;Generative AI and Jobs: A global analysis of potential effects on job quantity and quality&quot;,&quot;title-short&quot;:&quot;Generative AI and Jobs&quot;,&quot;URL&quot;:&quot;http://www.ilo.org/global/publications/working-papers/WCMS_890761/lang--en/index.htm&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Gmyrek&quot;,&quot;given&quot;:&quot;Pawel&quot;},{&quot;family&quot;:&quot;Berg&quot;,&quot;given&quot;:&quot;Janine&quot;},{&quot;family&quot;:&quot;Bescond&quot;,&quot;given&quot;:&quot;David&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2023&quot;,10,30]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2023&quot;,8,21]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">Gmyrek et al. (2023)</field>, which relies on the ILO’s global estimation model. This model is based on a harmonized microdata collection and a hierarchical imputation process, integrating data throughout the ISCO-08 structure from the most reliable sources at the highest level of detail available.<span class="footnote-box" onclick="footnotePop(fnID0EM1AG)" xmlns:mml="http://www.w3.org/1998/Math/MathML">20</span></p>
          <p class="Caption-Image">Figure 20. Global estimates of occupations potentially exposed to GenAI (% of employment by sex)</p>
          <p>
            <img width="100%" class="standard-img" src="chapter-10-image1.png" />
          </p>
          <p>At the global level, about a quarter of all employment falls into one of the four exposure gradients, with significant differences between female and male employment, particularly in the top two exposure gradients (Figure 18). Among male workers, approximately one-fifth of jobs fall within one of the exposure gradients, with 3.1% in gradient 3 and 2.4% in the highest exposure gradient (gradient 4). In contrast, not only is the total share of female employment in potentially exposed occupations notably higher, but the difference is also concentrated in the top two gradients, with 5.7% of female employment in gradient 3 and another 4.7% in gradient 4. These disparities are even more pronounced in High-Income Countries, where 34% of total employment falls within one of the four exposure gradients, with 17.3% in gradients 3 and 4. However, when disaggregated by gender, 28% of male employment is exposed, with only 3.5% in gradient 4, compared to 41% of female employment, with 14.4% in gradient 3 and 9.6% in gradient 4.</p>
          <p>Income-based differences in exposure are striking, with High-Income Countries showing the highest share of employment in one of the four exposure gradients (34%). The total share of exposed employment declines significantly as income levels decrease, reaching just 11% in Low-Income Countries (LICs). Lower income levels also reduce gender disparities in exposure, primarily due to the lower concentration of occupations in the highest exposure gradients (gradients 3 and 4). Gender disparities are also more pronounced in wealthier regions, particularly in Europe and Central Asia, where 39% of female employment falls into one of the four exposure gradients compared to 26% for men. These patterns reflect both occupational structures and the extent to which GenAI-exposed roles, such as clerical, financial, and customer service jobs, are concentrated in higher-income countries. </p>
          <p>These new estimates are consistent with those given in 2023, but more refined. The previous version attributed 2.3% of global employment to the “automation” category, one percentage point lower than the 3.3% assigned to gradient 4. In addition, the 2023 estimate attributed 13% of employment as subject to “augmentation” and an additional 16.2% of employment in “the big unknown”. The combined employment share for Gradients 1-3 for the world in the current analysis is 20.5%, 9 percentage points lower than combined shares of augmentation and “the big unknown” (29.2%) reported in 2023. The 2023 findings that women are more affected than men, and that the percentage of employment affected increases as countries’ income level increases, still hold.  </p>
          <p>It is important to stress that these new estimates reflect “exposure” to GenAI and not the actual impact on employment. As in 2023, the 2025 estimates represent the upper threshold of the percentage of employment that could be affected if GenAI technology were fully implemented. Infrastructure constraints (electricity, broadband), insufficient digital skills, the cost of technology, and inherent operational difficulties associated with the technology are just some of the barriers to full adoption. An important aspect also concerns the institutional and societal acceptance of automating tasks and occupations – even when technically feasible. For instance, few consumers may be inclined to watch evening news presented by avatars. Similarly, financial institutions might hesitate to fully delegate decisions such as mortgage approvals or business plan evaluations to AI systems, preferring to retain human judgement, oversight and accountability.</p>
          <p>Indeed, the results indicate that few jobs consist of tasks that are fully automatable with current GenAI technology; nearly all occupations have some tasks that require human input. Gradients 1-3 comprise occupations where the automation of specific tasks is limited, and some degree of task variability exists. As such, the “bundle of tasks” that constitutes occupations acts as a buffer against full automation. However, this does not mean that demand for these occupations will remain stable, as the efficiencies gained from introducing technology may mean that fewer workers are needed. If efforts are not made to help such jobs evolve with GenAI and integrate new tasks, even partial automation of existing tasks could lead to a decline in overall job demand in occupations found in higher exposure gradients. In addition, in some cases, the remaining set of non-automated tasks may result in jobs that are no longer humanly sustainable or desirable, thereby limiting the feasibility of adopting imbalanced technological solutions <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;tG7yvddn&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Tegtmeier et al., 2022)&quot;,&quot;plainCitation&quot;:&quot;(Tegtmeier et al., 2022)&quot;,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:51094,&quot;uris&quot;:[&quot;http://zotero.org/groups/5618753/items/Z5WATMJ3&quot;],&quot;itemData&quot;:{&quot;id&quot;:51094,&quot;type&quot;:&quot;article-journal&quot;,&quot;abstract&quot;:&quot;With the increasing digital transformation, work tasks are changing—in some cases, significantly. Our study addresses the question of whether the established criteria for work design are still sufficient or if they should get updated and additional criteria become necessary in the context of digitalization. In a multistage consensus process involving interdisciplinary groups of experts, we have identified specific criteria for the humane design of work in a world increasingly permeated by digitalized work tools. Starting with an expert workshop using a combined nominal group/focus group technique, followed by a real-time Delphi study, a content analysis and a five-stage peer comment process, we detected 13 criteria and 38 design guidelines for human-centered work in digital transformation. Mapping these with established criteria, it became apparent that some established criteria have experienced a new dynamic because of the digital transformation. For other criteria, a need for digitization-sensitive design is discernible. In addition, criteria have emerged whose necessity is rooted in the digital transformation. A diffusion and stronger interconnection of the various levels of the work system in connection with the digital transformation of work is apparent.&quot;,&quot;container-title&quot;:&quot;International Journal of Environmental Research and Public Health&quot;,&quot;DOI&quot;:&quot;10.3390/ijerph192315506&quot;,&quot;ISSN&quot;:&quot;1660-4601&quot;,&quot;issue&quot;:&quot;23&quot;,&quot;language&quot;:&quot;en&quot;,&quot;license&quot;:&quot;http://creativecommons.org/licenses/by/3.0/&quot;,&quot;note&quot;:&quot;number: 23\npublisher: Multidisciplinary Digital Publishing Institute&quot;,&quot;page&quot;:&quot;15506&quot;,&quot;source&quot;:&quot;www.mdpi.com&quot;,&quot;title&quot;:&quot;Criteria and Guidelines for Human-Centered Work Design in a Digitally Transformed World of Work: Findings from a Formal Consensus Process&quot;,&quot;title-short&quot;:&quot;Criteria and Guidelines for Human-Centered Work Design in a Digitally Transformed World of Work&quot;,&quot;volume&quot;:&quot;19&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Tegtmeier&quot;,&quot;given&quot;:&quot;Patricia&quot;},{&quot;family&quot;:&quot;Weber&quot;,&quot;given&quot;:&quot;Corinna&quot;},{&quot;family&quot;:&quot;Sommer&quot;,&quot;given&quot;:&quot;Sabine&quot;},{&quot;family&quot;:&quot;Tisch&quot;,&quot;given&quot;:&quot;Anita&quot;},{&quot;family&quot;:&quot;Wischniewski&quot;,&quot;given&quot;:&quot;Sascha&quot;}],&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2022&quot;,1]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">(Tegtmeier et al., 2022)</field>.</p>
          <p>Finally, the estimates do not account for new jobs that may be created, nor the technological advances that could potentially automate more tasks in the future. In that sense, our estimates present a static snapshot of the exposure of existing occupations to GenAI at the start of 2025.</p>
        </section>
        <section id="ID0EAXBG">
          <a id="ID0ECXBG"> </a>
          <h1>Conclusion</h1>
          <p>In this paper, we have presented the methodology used to develop a new global index of occupational exposure to GenAI, as well as new estimates of the global effects on employment. We build on the approach developed by the ILO in 2023, but with several notable refinements. First, by beginning our analysis with the Polish 6-digit occupational structure, we expand by ten-fold the amount of detailed task information available for the analysis of task automation. In addition, using a representative sample from the 29,753 tasks in the Polish occupational classification system and a survey of 1,640 people in Poland, we captured the opinions of each 1-digit ISCO-08 group on the potential for task automation in the job categories in which they are currently employed (52,558 data points). We then compared this input with an expert survey and conducted subsequent rounds of revisions among a smaller international expert group for the tasks with the highest degree of disagreement. Based on this process, we built a repository of knowledge with adjusted task scores that goes beyond Poland’s national specificities and reflects a broader consensus on the task automation potential of current GenAI tools. </p>
          <p>We subsequently used this repository to develop an AI assistant that could predict scores for these tasks based on this additional information as well as the technical documentation of ISCO-08. These scores update the original set of scores produced by the ILO in 2023 <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;vh724DyJ&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Gmyrek et al., 2023)&quot;,&quot;plainCitation&quot;:&quot;(Gmyrek et al., 2023)&quot;,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:50384,&quot;uris&quot;:[&quot;http://zotero.org/groups/4848274/items/RLX2P6B7&quot;],&quot;itemData&quot;:{&quot;id&quot;:50384,&quot;type&quot;:&quot;report&quot;,&quot;abstract&quot;:&quot;This study assesses the potential global exposure of occupations to Generative AI, particularly GPT-4. It predicts that the overwhelming effect of the technology will be to augment occupations, rather than to automate them. The greatest impact is likely to be in high and upper-middle income countries due to a higher share of employment in clerical occupations. As clerical jobs are an important source of female employment, the effects are highly gendered. Insights from this study underline the need for proactive policies that focus on job quality, ensure fair transitions, and that are based on dialogue and adequate regulation.&quot;,&quot;genre&quot;:&quot;Working paper&quot;,&quot;language&quot;:&quot;en&quot;,&quot;license&quot;:&quot;Copyright and permissions © 1996-2023 International Labour Organization - /global/copyright/lang--en/index.htm&quot;,&quot;note&quot;:&quot;ISBN: 9789220395356&quot;,&quot;source&quot;:&quot;www.ilo.org&quot;,&quot;title&quot;:&quot;Generative AI and Jobs: A global analysis of potential effects on job quantity and quality&quot;,&quot;title-short&quot;:&quot;Generative AI and Jobs&quot;,&quot;URL&quot;:&quot;http://www.ilo.org/global/publications/working-papers/WCMS_890761/lang--en/index.htm&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Gmyrek&quot;,&quot;given&quot;:&quot;Pawel&quot;},{&quot;family&quot;:&quot;Berg&quot;,&quot;given&quot;:&quot;Janine&quot;},{&quot;family&quot;:&quot;Bescond&quot;,&quot;given&quot;:&quot;David&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2023&quot;,10,30]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2023&quot;,8,21]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">(Gmyrek et al., 2023)</field>. The use of a verified “knowledge base” presents an important methodological improvement, which greatly enhances stability of our predictions across independent LLMs (see Section 6), and which can be used to produce similar score predictions for other occupational classification systems that contain job-specific tasks. In addition, we make all task-level scores publicly available, which also makes it possible for researchers to organize the occupational exposure in different ways than our proposed framework of exposure gradients.</p>
          <p>The new global index presented in this paper is generic, due to the nature of ISCO-08 and the structure of tasks associated with occupations in this framework. Its definite strength – similar to ISCO-08 – is that it provides a common global denominator and a direct link to national labour forces surveys held in the ILO harmonized micro data repository, which relies on the same classification of occupational structures. Even though all countries do not use ISCO-08, mappings of the national systems to this common international standard are available. This eliminates the need for crosswalks from other national systems (e.g. O*NET), which involves tenuous assumptions about the similarity of detailed occupations in the technologically advanced context of the USA to other countries, especially non-HICs. The simple and comparable character of our ISCO-08 based index enables direct production of global, regional and income-based employment estimates, based on the same statistical modelling techniques that are used by the ILO for other global figures (see Section 11).</p>
          <p>Our 2025 scores are presented in a revised occupational classification system, adopting a framework of four progressively increasing exposure gradients, that better highlights the importance of potential AI exposure and task variability for determining possible outcomes. We produced a new set of global estimates of GenAI exposure based on this revised classification.</p>
          <p>The new index maintains many of the headline findings of the 2023 methodology. Clerical occupations continue to have the highest exposure levels, albeit with some important downward revisions to individual tasks scores. Such occupations include data entry clerks, typists, accounting, bookkeeping clerks and administrative secretaries. Additionally, some occupations – such as financial analysts, and web and multimedia developers (gradient 4), as well as bank tellers, translators, applications programmers, investment advisers (gradient 3) – have increased their levels of exposure, highlighting the expanding abilities of GenAI technology to potentially automate more specialized tasks in professional and technical roles.</p>
          <p>Overall, the revised global employment estimates of GenAI exposure are lower than in our 2023 paper, though still, one in four jobs globally (24%) has some degree of exposure, and one in three jobs in high-income countries. What is particularly striking is the continued association of gender with occupations with higher levels of exposure, especially in higher-income countries. Compared to 7.8% of female employment and 2.9% of male employment in high-income countries classified as having high automation potential in 2023, the current study increases these figures to 9.6% for females and 3.5% for males, respectively.</p>
          <p>Notwithstanding these findings, we stress that such exposure does not imply the immediate automation of an entire occupation, but rather the potential for a large share of its current tasks to be performed using this technology. Whether this leads to the disappearance of an occupation or workforce replacement is a more complex question – one that will depend on the initial decision to adopt the technology, but also the extent to which individuals in these occupations are given opportunities to learn to work with these technologies and adapt to the evolving nature of their tasks. As argued by numerous economists, the key to unlocking the productivity benefits of GenAI lies not in the search of outright labour savings, but in the extent to which human expertise can be complemented with new technological capacities to reshape occupations and generate additional value-added <field code=" ADDIN ZOTERO_ITEM CSL_CITATION {&quot;citationID&quot;:&quot;ZS2fMSAE&quot;,&quot;properties&quot;:{&quot;formattedCitation&quot;:&quot;(Acemoglu, 2024; Autor, 2024)&quot;,&quot;plainCitation&quot;:&quot;(Acemoglu, 2024; Autor, 2024)&quot;,&quot;noteIndex&quot;:0},&quot;citationItems&quot;:[{&quot;id&quot;:50791,&quot;uris&quot;:[&quot;http://zotero.org/groups/5406503/items/KQ5YES7C&quot;],&quot;itemData&quot;:{&quot;id&quot;:50791,&quot;type&quot;:&quot;article-journal&quot;,&quot;abstract&quot;:&quot;This paper evaluates claims about the large macroeconomic implications of new advances in AI. It starts from a task-based model of AI’s effects, working through…&quot;,&quot;container-title&quot;:&quot;Massachusetts Institute of Technology&quot;,&quot;language&quot;:&quot;en&quot;,&quot;title&quot;:&quot;The Simple Macroeconomics of AI&quot;,&quot;URL&quot;:&quot;https://shapingwork.mit.edu/research/the-simple-macroeconomics-of-ai/&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Acemoglu&quot;,&quot;given&quot;:&quot;Daron&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,5,7]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,4,5]]}}},{&quot;id&quot;:50675,&quot;uris&quot;:[&quot;http://zotero.org/groups/5406503/items/5L7VK2A4&quot;],&quot;itemData&quot;:{&quot;id&quot;:50675,&quot;type&quot;:&quot;article&quot;,&quot;abstract&quot;:&quot;While the utopian vision of the current Information Age was that computerization would flatten economic hierarchies by democratizing information, the opposite has occurred. Information, it turns out, is merely an input into a more consequential economic function, decision-making, which is the province of elite experts. The unique opportunity that AI offers to the labor market is to extend the relevance, reach, and value of human expertise. Because of AI’s capacity to weave information and rules with acquired experience to support decision-making, it can be applied to enable a larger set of workers possessing complementary knowledge to perform some of the higher-stakes decision-making tasks that are currently arrogated to elite experts, e.g., medical care to doctors, document production to lawyers, software coding to computer engineers, and undergraduate education to professors. My thesis is not a forecast but an argument about what is possible: AI, if used well, can assist with restoring the middle-skill, middle-class heart of the US labor market that has been hollowed out by automation and globalization.&quot;,&quot;collection-title&quot;:&quot;Working Paper Series&quot;,&quot;DOI&quot;:&quot;10.3386/w32140&quot;,&quot;genre&quot;:&quot;Working Paper&quot;,&quot;note&quot;:&quot;DOI: 10.3386/w32140&quot;,&quot;number&quot;:&quot;32140&quot;,&quot;publisher&quot;:&quot;National Bureau of Economic Research&quot;,&quot;source&quot;:&quot;National Bureau of Economic Research&quot;,&quot;title&quot;:&quot;Applying AI to Rebuild Middle Class Jobs&quot;,&quot;URL&quot;:&quot;https://www.nber.org/papers/w32140&quot;,&quot;author&quot;:[{&quot;family&quot;:&quot;Autor&quot;,&quot;given&quot;:&quot;David&quot;}],&quot;accessed&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,3,14]]},&quot;issued&quot;:{&quot;date-parts&quot;:[[&quot;2024&quot;,2]]}}}],&quot;schema&quot;:&quot;https://github.com/citation-style-language/schema/raw/master/csl-citation.json&quot;} ">(Acemoglu, 2024; Autor, 2024)</field>.</p>
          <p>Ensuring such positive synergies necessitates an approach to technology’s adoption at the workplace that is human-centered. With one in four workers across the world in an occupation with some degree of GenAI exposure, there is need to ensure that the transition is managed through social dialogue, both to minimize “technological unemployment” and the hardship associated with it, but also to ensure that for the majority who remain employed, the technology is implemented in a way that that supports them in carrying out their jobs. Workers know their jobs best and can play an important role in the design, adaptation and use of the technology at the workplace, to the benefit of both working conditions and productivity.  </p>

            <h2>2. Sampling Formula for section 4.2.</h2>
            <p>As presented in section 4.2, we apply the standard formula for calculating sample size in order to assign assigning the scoring tasks to the human evaluators. </p>
            <p>
              <math>
                <mi>n</mi>
                <mo>=</mo>
                <mfrac>
                  <mrow>
                    <msup>
                      <mrow>
                        <mi>Z</mi>
                      </mrow>
                      <mrow>
                        <mn>2</mn>
                      </mrow>
                    </msup>
                    <mo>⋅</mo>
                    <mi>p</mi>
                    <mo>⋅</mo>
                    <mfenced separators="|">
                      <mrow>
                        <mn>1</mn>
                        <mo>-</mo>
                        <mi>p</mi>
                      </mrow>
                    </mfenced>
                  </mrow>
                  <mrow>
                    <msup>
                      <mrow>
                        <mi>E</mi>
                      </mrow>
                      <mrow>
                        <mn>2</mn>
                      </mrow>
                    </msup>
                  </mrow>
                </mfrac>
              </math>
            </p>
            <p>Where:</p>
            <ul>
              <li>
                <p>N is sample size</p>
              </li>
              <li>
                <p>Z is the Z-value (1.96 for a 95% confidence level)</p>
              </li>
              <li>
                <p>p is the estimated proportion of the population that has a particular characteristic</p>
              </li>
              <li>
                <p>E is the margin of error (e.g., standard 0.05)</p>
              </li>
            </ul>
            <p>In this formula, p traditionally refers to the proportion of "successes" in the population, which represents a probability-based assumption about the variability. Since in the selection of a sample of tasks we do not know that variability, we use the most conservative approach of applying p=0.5, which gives the safest (largest) sample size for each group of tasks.<span class="footnote-box" onclick="footnotePop(fnID0EDXDK)" xmlns:mml="http://www.w3.org/1998/Math/MathML">21</span> Subsequently, we apply the standard correction formula for a finite population, where N is the number of tasks for each 1-digit category:</p>
            <p>
              <math>
                <msub>
                  <mrow>
                    <mi>n</mi>
                  </mrow>
                  <mrow>
                    <mi>a</mi>
                    <mi>d</mi>
                    <mi>j</mi>
                    <mi>u</mi>
                    <mi>s</mi>
                    <mi>t</mi>
                    <mi>e</mi>
                    <mi>d</mi>
                  </mrow>
                </msub>
                <mo>=</mo>
                <mfrac>
                  <mrow>
                    <mi>n</mi>
                  </mrow>
                  <mrow>
                    <mn>1</mn>
                    <mo>+</mo>
                    <mfrac>
                      <mrow>
                        <mi>n</mi>
                        <mo>-</mo>
                        <mn>1</mn>
                      </mrow>
                      <mrow>
                        <mi>N</mi>
                      </mrow>
                    </mfrac>
                  </mrow>
                </mfrac>
              </math>
            </p>
          </section>

            <p>

        <p> These tasks were split into an 80-20 proportion, with 80% used for training and 20% reserved for validation. Performance was measured using Root Mean Square Error (RMSE) and Mean Absolute Error (MAE), with the adjusted scores showing better agreement (MAE = 0.0494, RMSE = 0.0724) compared to the predicted scores (MAE = 0.0684, RMSE = 0.0963). Correlation analysis further supported this, with adjusted scores exhibiting higher Pearson (0.895) and Spearman (0.884) correlations than predicted scores (Pearson: 0.796, Spearman: 0.776). This is understandable, as the adjusted scores were based on two points of reference (survey score and expert score), making them more stable and easier to predict. In contrast, for the predicted scores, the test involves a repeated prediction process, which amplifies the original error.</p>
