name: Weekly data refresh

# Refreshes the open data behind the app and saves the results in the repo. Replit deploys from main,
# so a changed file reaches the live site. Team-written files are never changed here.
on:
  schedule:
    - cron: '0 2 * * 1' # Mondays 02:00 UTC (10:00 Malaysia time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The refresh scripts use only Node built-ins and files in the repo, so no npm install is needed.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh trends, research, reference links and course pages
        run: node scripts/refresh-data.mjs
      - name: Save changed data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends.json data/research.json data/references.json data/course_checks.json
          if git diff --cached --quiet; then
            echo "No data changed."
          else
            git commit -m "data: weekly refresh"
            git push origin HEAD:main
          fi
